const PDEEP=[
{m:3,d:4,t:"Planning deep dive 1: process, versions and dimensions",s:"How a planning project is set up, in SAP's own order",
goal:"By the end, you can explain the three planning phases and who does what, manage every version action, and design planning dimensions and members correctly.",
body:`<p>This lesson and the next one follow SAP's manual planning course (SACP23) unit by unit.</p>
<h3>The three planning process phases</h3>
<div class="grid3"><div class="card"><h3>1. Prepare</h3><p>Planners with modeling rights build <b>planning models</b> and <b>dimensions</b>, add data actions, create planning <b>stories</b>, and set up and assign <b>calendar tasks and processes</b>.</p></div>
<div class="card"><h3>2. Plan</h3><p>Users enter data and publish it. Planners across departments work together, so numbers often go back and forth. Planners create and share <b>private versions</b>; viewers <b>comment and discuss</b>.</p></div>
<div class="card"><h3>3. Finalize</h3><p>Results are <b>reviewed, approved and published</b>, then <b>locked</b> so approved figures can't change. Plan data can also be <b>exported</b>.</p></div></div>
<h3>Planning words you must know</h3>
<div class="scroll"><table class="stack"><thead><tr><th>Topic</th><th>Key points</th></tr></thead><tbody>
<tr><td>Connections</td><td>SAC connects to on-premise and cloud sources to import actuals and master data.</td></tr>
<tr><td>Dimensions</td><td>Master data (cost centre, product, account). Base (leaf) members have no children; parent nodes do. <b>Public</b> dimensions are shared by many models; <b>private</b> dimensions belong to one model.</td></tr>
<tr><td>Planning model</td><td>At least one measure; usually an Account dimension. SAC <b>creates the Version and Date dimensions automatically</b>. Date can be daily, weekly, monthly/period, quarterly or yearly.</td></tr>
<tr><td>Typical flow</td><td>Import actuals → copy them into a plan version → plan → approve → publish.</td></tr>
<tr><td>Data export</td><td>Plan data can be exported back to SAP systems such as SAP BW, SAP Integrated Business Planning and SAP S/4HANA.</td></tr>
<tr><td>Disaggregation</td><td>Values typed on a parent are spread to leaf members (equally or by existing values). <b>Data is stored only on base members.</b></td></tr>
<tr><td>Data locking</td><td>After approval, lock the version and period.</td></tr>
<tr><td>Data point comments</td><td>Notes on a specific cell to explain a value.</td></tr></tbody></table></div>
<p style="color:var(--soft)">Optional: SAP's <b>Content Network</b> has planning business packages (ready models and stories) you can import to start faster.</p>
<h3>Versions: every action in the Version Management panel</h3>
<div class="scroll"><table class="stack"><thead><tr><th>Action</th><th>Result</th></tr></thead><tbody>
<tr><td>Create Blank Public Version</td><td>New public version, no data</td></tr>
<tr><td>Copy (public)</td><td>New version with the data</td></tr>
<tr><td>Publish (public)</td><td>Writes your unpublished (edit-mode) changes to the database</td></tr>
<tr><td>Create Blank Private Version</td><td>Your own empty sandbox</td></tr>
<tr><td>Publish (private)</td><td>Writes private data into an <b>existing</b> public version</td></tr>
<tr><td>Publish As (private)</td><td>Writes private data into a <b>new</b> public version</td></tr>
<tr><td>Copy (private)</td><td>New private version (with comments if enabled)</td></tr>
<tr><td>More</td><td>Share as read-only or editable, Undo, Redo, History, Delete, Details</td></tr>
<tr><td>Show versions in use only</td><td>Hides versions not in the table filter</td></tr></tbody></table></div>
<div class="grid2"><div class="card"><h3>Rules to remember</h3><ul><li>A planning model has exactly <b>one Actual version</b> (public.Actual, created automatically).</li><li>Other versions are usually created <b>in stories</b>.</li><li>Private versions save automatically and don't need publishing; only the creator sees them unless shared.</li><li>Leaving a story with unpublished public changes asks you to <b>Revert all</b> or <b>Publish all</b>.</li><li><b>Publishing can't be undone.</b></li><li>Data actions can publish when they run; multi actions publish in a separate step.</li><li>Data can only be <b>imported into a public version</b> (Actual by default).</li><li>Admins can delete all private data from the model preferences.</li></ul></div>
<div class="card"><h3>Version categories</h3><ul><li><b>Actual</b>: what really happened</li><li><b>Budget</b>: spending allowance</li><li><b>Planning</b>: longer-term goals (1–3 years)</li><li><b>Forecast</b>: updated monthly or quarterly</li><li><b>Rolling Forecast</b>: some months of actuals + 12–18 months ahead</li></ul><p>The categories work the same way technically; they describe the purpose.</p></div></div>
<h3>Designing planning dimensions</h3>
<div class="scroll"><table class="stack"><thead><tr><th>Type</th><th>Facts</th></tr></thead><tbody>
<tr><td>Account</td><td>Financial lines; one per model; system properties like Formula and Aggregation Type</td></tr>
<tr><td>Generic</td><td>Anything else; many allowed; many hierarchies</td></tr>
<tr><td>Organization</td><td>Cost/profit centres; one per model; comes with <b>Currency</b> and <b>Person Responsible</b> properties</td></tr>
<tr><td>Version</td><td>System-generated in planning models; one per model; no hierarchies; property <b>Category</b></td></tr>
<tr><td>Date</td><td>System-generated; sets the time frame and granularity</td></tr></tbody></table></div>
<div class="grid2"><div class="card"><h3>Public vs private dimension</h3><ul><li><b>Public</b>: standalone, reused by many models, kept if a model is deleted, own scheduled imports.</li><li><b>Private</b>: inside one model, deleted or copied with it, no own scheduled import.</li></ul></div>
<div class="card"><h3>Properties and hierarchies</h3><ul><li>Properties help sorting, filtering, currency conversion and display. ID, Description and Hierarchy are <b>columns</b>, not properties.</li><li><b>Level-based</b> hierarchies (Generic, Organization) or <b>parent-child</b>; a dimension uses one style, not both.</li><li>In planning, <b>don't book data directly on parent nodes</b>.</li></ul></div></div>
<h3>Adding new members from a data table</h3>
<ul><li>Right-click a cell → <b>Add Member</b>; a blank row appears. Set ID, Description, Parent Node, and whether it is a child or sibling; fill properties if any.</li><li>Not possible for <b>Account, Version or Date</b>.</li><li>New members have no data (<b>unbooked</b>, shown as "-"). Turn on <b>Unbooked Data</b> in the table to see them.</li><li>After saving, the member's details can't be changed in the story; members can only be <b>deleted in the model</b>, and only if they have no data.</li><li>Large companies usually keep master data in a central system; adding members in stories is for practical cases like a new product.</li></ul>`,
say:"Prepare, Plan, Finalize. Versions are your workspace; dimensions are your structure.",
act:"In a planning story, open Version Management: create a private version, copy it, share it read-only, then Publish As 'Budget – Option B'. Add a new product member from the table and plan it.",
qs:[
{q:"Name the three planning process phases in order.",a:`<p><b>Prepare</b> (models, dimensions, stories, tasks) → <b>Plan</b> (enter, publish, collaborate) → <b>Finalize</b> (review, approve, publish, lock, export).</p>`},
{q:"Which dimensions does SAC create automatically in a new planning model?",o:["Account and Product","Version and Date","Organization and Generic","None"],r:1,a:`<p><b>Version</b> and <b>Date</b> are generated automatically.</p>`},
{q:"How many Actual versions can a planning model have?",o:["One","Two","Unlimited","None"],r:0,a:`<p><b>One</b> (public.Actual).</p>`},
{q:"Into which kind of version can you import data?",o:["Only public versions","Only private versions","Any version","Only Budget"],r:0,a:`<p>Data imports go into a <b>public</b> version (Actual by default).</p>`},
{q:"You try to add a new Account member from the planning table. What happens?",o:["It works","It's not possible for Account, Version or Date","It deletes the model","It creates a dataset"],r:1,a:`<p>Adding members from tables is <b>not possible for Account, Version or Date</b>.</p>`},
{q:"Public vs private dimension: which one survives if the model is deleted?",o:["Public","Private","Both","Neither"],r:0,a:`<p><b>Public</b> dimensions are standalone and reused by many models.</p>`},
{q:"Can you undo a publish?",o:["Yes, with Undo","No, publishing can't be undone"],r:1,a:`<p><b>No.</b> Check before you publish.</p>`}
]},
{m:3,d:4,t:"Planning deep dive 2: data entry, control, audit and seamless planning",s:"Every way to type, spread, protect and trace plan data",
goal:"By the end, you can use input shortcuts, control disaggregation, use value locks, read-only cells and planning panels, choose the data entry mode, write inverse formulas, configure validation rules and data locking, audit changes, and set up seamless planning.",
body:`<h3>Typing smart: input shortcuts</h3>
<div class="scroll"><table class="stack"><thead><tr><th>Type this</th><th>Effect (cell has 100)</th></tr></thead><tbody>
<tr><td>*2</td><td>Multiply → 200</td></tr><tr><td>/4</td><td>Divide → 25</td></tr><tr><td>10%</td><td>Increase by 10% → 110</td></tr><tr><td>-10%</td><td>Decrease by 10% → 90</td></tr><tr><td>+50</td><td>Add → 150</td></tr><tr><td>-50</td><td>Subtract → 50</td></tr><tr><td>1M / 5K / 2B</td><td>Million / thousand / billion (also T, Thousand, Million, Bn)</td></tr></tbody></table></div>
<p>Changed cells are highlighted; an asterisk and yellow mark show <b>unpublished</b> changes. You can paste from Excel.</p>
<h3>Controlling disaggregation</h3>
<ul><li>Typing on a parent: changes to existing values spread <b>proportionally</b>; empty children get <b>equal</b> shares. Only leaf values are saved.</li><li>If the <b>unassigned member (#)</b> is a leaf of that cell, it gets the full value.</li><li>Control spreading by filtering the table to leaf members, by model <b>Data Aggregation</b> settings, by locks and by validation rules (extra checks can cost some speed).</li></ul>
<div class="grid2"><div class="card"><h3>Value lock (cell lock)</h3><ul><li>Right-click → <b>Lock Cell</b>, or manage many in the <b>Value Lock Management</b> panel (view, create, clear, reorder).</li><li>Locked cells are not changed by data entry or spreading.</li><li>Locks are saved with the story page and apply to everyone opening it.</li><li>A cell lock is <b>not a hard control</b>: users can remove it. Use data locking for real control.</li></ul></div>
<div class="card"><h3>Read-only cells</h3><ul><li><b>More → Set/unset read only for selected cells</b>.</li><li>Blocks typing in those cells but <b>still allows disaggregation</b> into them.</li><li>Shown grey; saved with the story.</li></ul></div></div>
<h3>Data entry modes</h3>
<div class="scroll"><table class="stack"><thead><tr><th>Mode</th><th>How it works</th><th>When</th></tr></thead><tbody>
<tr><td>Fluid (default for new tables)</td><td>Entries typed quickly are processed together after a short pause (default 1 second; admin can change it)</td><td>Most cases; table stays interactive</td></tr>
<tr><td>Mass data entry</td><td>Type many values, then click <b>Process Data</b> (or exit without applying)</td><td>Rare, very large updates</td></tr>
<tr><td>Single</td><td>Each change processed immediately</td><td>Avoid where possible (slower)</td></tr></tbody></table></div>
<h3>Multiple hierarchies and the planning panel</h3>
<ul><li>Example: a lead planner enters a total by <b>store type</b> and locks it; store planners then plan <b>by store</b> and can't exceed the locked total (other stores adjust).</li><li><b>Distribute Value</b> panel (right-click → Allocate → Distribute Value): choose the amount, target cells (across levels and members), <b>Overwrite</b> or <b>Append</b>, and the key: <b>Input Values, Input Weights, Equally, Proportionally</b>. Preview, then Apply.</li><li>Use case: absorb a year-to-date overspend by appending a negative amount to the remaining months.</li></ul>
<h3>Inverse formulas: exact syntax</h3>
<pre style="min-height:0">[Revenue] - [Cost] | INVERSE([Cost] := [Revenue] - [Profit])
                   OR INVERSE([Revenue] := [Profit] + [Cost])</pre>
<p>Add a pipe <code>|</code> after the formula, then <code>INVERSE([Target] := ...)</code> (note the colon). Several inverses are tried <b>in order</b>: the second is used if the first can't apply (for example Cost is locked). Percent accounts can also accept input. Turn on the <b>Formula Bar</b> to see formulas.</p>
<h3>Data validation rules (details)</h3>
<div class="grid2"><div class="card"><h3>Set up</h3><ol><li>Enable <b>Validation Rules</b> in model settings.</li><li>Create a rule: <b>member-based</b> (pick dimensions and allowed members) or <b>attribute-based</b> (map a property to a matching dimension).</li><li>Activate and save; test in a story.</li></ol><p>In the table, turn on <b>Color Fill for Editable Cells</b> and <b>Reason for unplannable data</b>; exclude unassigned members so spreading only hits valid cells.</p></div>
<div class="card"><h3>Limits</h3><ul><li>Up to <b>3 rules</b> per model, <b>3 dimensions</b> per rule, a dimension in up to 10 rules.</li><li>No Date or Version in rules.</li><li>Only custom properties.</li><li>Needs Planning Professional licence and Validation Rule permission.</li><li>If master data changes make data invalid, it's flagged; move it with a copy data action, then delete the old combination.</li></ul></div></div>
<h3>Data locking (details)</h3>
<ul><li>Enable in <b>Model Settings → Access and Privacy</b>; pick the default state (Open or Locked).</li><li>Choose <b>driving dimensions</b>: Version is mandatory; Date and Entity are typical.</li><li>Ownership uses properties on the organization dimension: <b>Hierarchy</b> (children inherit), <b>Person Responsible</b> (one user), <b>Data Locking Owner</b> (users and teams).</li><li>States: <b>Open</b>, <b>Restricted</b> (owners only), <b>Locked</b> (nobody); <b>Mixed</b> shows on parents. Changing a parent changes its children.</li><li>In stories: More Actions → Show/Hide → <b>Data Locks</b>. Non-owners can switch on <b>Ignore Data Locks</b> to try values, but <b>cannot publish</b> them.</li></ul>
<h3>Auditing plan data</h3>
<ul><li>Turn on <b>Data Audit</b> in the model (Access and Privacy). Logging starts <b>from that moment</b>.</li><li>Changes are logged when data is <b>published</b> to public versions.</li><li>View in <b>Security → Data Changes</b>: pick the model, choose columns (old, new and delta values, user, time), filter, download as CSV, and delete old entries to save space.</li><li>Needs Read (and Delete) permission on the <b>Data Change Log</b>.</li></ul>
<h3>Seamless planning with SAP Datasphere</h3>
<div class="grid2"><div class="card"><h3>Requirements</h3><ul><li>SAC on HANA Cloud, linked <b>1:1</b> to one Datasphere tenant by the system owner.</li><li>Licences for both (planning users in SAC; capacity units in Datasphere).</li><li>A Datasphere <b>space</b> to store the data.</li></ul></div>
<div class="card"><h3>Steps</h3><ol><li>Modeler → new model → storage location <b>SAP Datasphere</b> → pick the space (choosing SAC storage means no seamless planning).</li><li>Create the model (for example from a file), enable planning.</li><li>Expose it: name the <b>fact table</b>, save.</li><li>In Datasphere the fact table (and public dimensions) appear as <b>read-only local tables</b>; use them in graphical views, SQL views and <b>analytic models</b>, then report or plan on them in SAC.</li></ol></div></div>
<p>SAC owns the model structure and planning logic; Datasphere is the storage and processing layer. Newer releases can also show Datasphere actuals in a planning model as a <b>live version</b> without copying.</p>`,
say:"Type smart, spread on purpose, lock what matters, validate combinations, audit changes.",
act:"Try *2, 10% and 1M in a planning table. Set read-only cells, then distribute a value with the planning panel. Enable data audit, publish, and look at Security → Data Changes.",
qs:[
{q:"A cell holds 100. You type 10%. Result?",o:["10","110","1000","90"],r:1,a:`<p><b>110</b>: X% increases by X percent.</p>`},
{q:"What does typing 2M mean?",o:["2 months","2,000,000","2 minutes","2 thousand"],r:1,a:`<p><b>2,000,000</b> (M = million).</p>`},
{q:"Which mode is the default for new planning tables?",o:["Single","Fluid","Mass","Offline"],r:1,a:`<p><b>Fluid</b> data entry.</p>`},
{q:"Read-only cells vs value lock: what's the key difference?",a:`<p><b>Read-only</b> stops typing but still lets disaggregation write into the cells. A <b>value lock</b> stops both typing and spreading from changing the cell.</p>`},
{q:"Write an inverse formula so users can enter Profit and Cost adjusts (Profit = Revenue − Cost).",a:`<p><code>[Revenue] - [Cost] | INVERSE([Cost] := [Revenue] - [Profit])</code></p>`},
{q:"How many validation rules can one model have?",o:["1","3","10","Unlimited"],r:1,a:`<p>Up to <b>3 rules</b>, each with up to 3 dimensions.</p>`},
{q:"A non-owner switches on Ignore Data Locks and types values. Can they publish?",o:["Yes","No"],r:1,a:`<p><b>No.</b> They can try values but cannot publish them.</p>`},
{q:"Where do you see who changed plan data, with old and new values?",o:["Security → Data Changes (with Data Audit on)","Calendar","Content Network","Home"],r:0,a:`<p><b>Security → Data Changes</b>, once Data Audit is enabled on the model.</p>`},
{q:"Seamless planning: where is the plan data stored?",o:["In SAC only","In an SAP Datasphere space","In Excel","In BW"],r:1,a:`<p>In an <b>SAP Datasphere space</b>, exposed as a read-only fact table.</p>`}
]},
{m:3,d:5,t:"Planning deep dive 3: data actions, multi actions, allocations, currency, forecasting and the calendar",s:"Everything from SAP's advanced planning course in one place",
goal:"By the end, you know every data action and multi action step, starter settings, permissions and monitoring, advanced formula editors and rules, performance tips, dynamic time, allocation settings, currency setup, rolling forecast and predictive settings, VDT and Compass details, and how a calendar process runs.",
body:`<h3>Data actions: full picture</h3>
<div class="scroll"><table class="stack"><thead><tr><th>Step</th><th>Details</th></tr></thead><tbody>
<tr><td>Copy</td><td>Inside one model, with rules, filters and aggregation; one source member to one or more targets</td></tr>
<tr><td>Cross-model copy</td><td>From another model, with automatic or manual member mapping</td></tr>
<tr><td>Allocation</td><td>New or existing allocation (source, driver, target)</td></tr>
<tr><td>Conversion</td><td>For models with measures: copy between measures with currency conversion</td></tr>
<tr><td>Fact deletion</td><td>Delete facts, delete zeros, or set facts to zero (needs Maintain privilege)</td></tr>
<tr><td>Embedded data action</td><td>Run another data action of the <b>same model</b>; inner parameters must get values in the designer; a data action can't contain itself</td></tr>
<tr><td>Advanced formulas</td><td>Scripts and calculations; AI can help generate scripts or comments</td></tr></tbody></table></div>
<p>Steps run <b>in order</b>, each step sees the result of the one before.</p>
<div class="grid2"><div class="card"><h3>Ways to run</h3><ul><li>A <b>starter</b> (trigger) in a story</li><li>A <b>script</b> in an advanced story</li><li>A <b>calendar</b> Data Action Task (good for long overnight runs; statuses Open, Successful, Failed)</li><li>The <b>Excel add-in</b></li></ul></div>
<div class="card"><h3>Starter settings</h3><ul><li>If target version isn't in edit mode: <b>Empty Planning Area</b>, <b>Recommended Planning Area</b> (based on locks and data access) or <b>All Version Data</b>.</li><li>Publish: do not publish / publish and fail on warnings / publish and ignore warnings.</li></ul></div>
<div class="card"><h3>Permissions</h3><ul><li><b>Data action designer</b>: full rights to build and change.</li><li><b>Data action user</b>: Read + Execute only.</li></ul></div>
<div class="card"><h3>Parameters and monitoring</h3><ul><li>Parameter types: <b>Member/Measure</b> and <b>Number</b>. Values from member selection, defaults, story filters or input controls. A source-member parameter needs <b>Single</b> cardinality.</li><li><b>Job Monitor – Data Actions</b>: who ran it, when, where, parameters, records, duration (history 30 days by default).</li></ul></div></div>
<h3>Advanced formulas: editors, options and rules</h3>
<div class="grid2"><div class="card"><h3>Visual vs script editor</h3><p><b>Visual editor</b> for simpler logic; <b>script editor</b> for complex code. You can switch any time. The visual editor offers 5 options: <b>Calculation</b>, <b>Delete</b>, <b>Condition</b> (IF), <b>Repeat</b> (FOREACH loop), <b>Comment</b>.</p></div>
<div class="card"><h3>Syntax cheat sheet</h3><ul><li><code>[d/Dim]</code> dimension, <code>[p/Prop]</code> property, <code>[h/Hier]</code> hierarchy</li><li><code>%Param%</code> parameter, <code>"#"</code> unassigned, <code>"Revenue"</code> member</li><li><code>VARIABLEMEMBER #Name OF [d/Measures]</code> temporary members</li><li>Ctrl + Space for value help</li></ul></div>
<div class="card"><h3>CONFIG settings</h3><ul><li><b>Time hierarchy</b>: YQM or fiscal FYQP (affects FIRST, LAST)</li><li><b>Sign flip</b>: <code>CONFIG.FLIPPING_SIGN_ACCORDING_ACCTYPE=ON</code> (default is absolute values)</li><li><b>Unbooked data</b>: treat empty cells as zero or not</li></ul></div>
<div class="card"><h3>Rules</h3><ul><li>Each line sees the results of earlier lines.</li><li>Only <b>leaf</b> members without account formulas are calculated.</li><li>RESULTLOOKUP reads the most detailed data.</li><li><b>NULL</b> = no value, so nothing is written; <b>0</b> is a real number.</li><li>No MEMBERSET = all members of each dimension.</li></ul></div></div>
<pre style="min-height:0">MEMBERSET [d/Date] = (BASEMEMBER([d/Date].[h/YQM], "[2024]"))
MEMBERSET [d/Measures] = ("Amount")
MEMBERSET [d/Account] = ("Revenue")
IF [d/Company] = "US" THEN
  DATA() = RESULTLOOKUP([d/Date] = PREVIOUS(12)) * 1.1
ENDIF</pre>
<h3>Data action performance (SAP's 8 tips)</h3>
<ol><li>Check the calculation scope (hover after validating).</li><li>Reduce and narrow <b>FOREACH</b>.</li><li>Remove unnecessary <b>IF</b>s; order nested ones well.</li><li>Limit <b>RESULTLOOKUP</b> (each reads the database).</li><li>Avoid <b>= NULL</b> comparisons.</li><li>Use fewer <b>DATA</b> statements.</li><li>Use AGGREGATE_DIMENSIONS, AGGREGATE_WRITETO and MODEL to aggregate first.</li><li>Define as many <b>MEMBERSET</b>s as possible.</li></ol>
<p>Admins can also use <b>Performance → Statistics and Analysis</b> and SAP's troubleshooting decision tree.</p>
<h3>Dynamic time (no hard-coded years)</h3>
<p>One <b>input control</b> sets the year for both the input table and the data action. The table uses <b>restricted measures</b> with dynamic time (for example "PY Actual" = Actual, previous year; "CY Fcst" = Forecast, current year) and a dynamic text header. The data action takes the year from a parameter and uses <code>PREVIOUS(12)</code> to find the prior year automatically.</p>
<h3>Multi actions: all step types</h3>
<div class="scroll"><table class="stack"><thead><tr><th>Step</th><th>Does</th></tr></thead><tbody>
<tr><td>Data Action</td><td>Runs a data action (fixed values or multi action parameters)</td></tr>
<tr><td>Predictive</td><td>Retrains a time-series model and writes the forecast to a version</td></tr>
<tr><td>Version Management</td><td>Publishes a version</td></tr>
<tr><td>Data Locking</td><td>Sets data locks</td></tr>
<tr><td>Data Import</td><td>Imports master and transaction data from SAP sources</td></tr>
<tr><td>PaPM Integration</td><td>Runs SAP Profitability and Performance Management activities</td></tr>
<tr><td>API</td><td>Calls external apps via HTTP</td></tr>
<tr><td>Comment Management</td><td>Copies or deletes comments between versions</td></tr></tbody></table></div>
<p>Use a multi action when you work across <b>several models or versions</b> or must publish between steps. Tip: several data actions on the same model and version → embed them in one data action first.</p>
<h3>Allocations: all settings</h3>
<ul><li><b>Source</b> (any dimension except Version, often Cost Centre), <b>Driver</b> (e.g. kWh, headcount), <b>Target</b> (not Version or Account), <b>Reference dimensions</b> for finer weights (Date by default).</li><li><b>Keep Source</b>: copies instead of emptying the source. <b>Overwrite Target</b>: clears targets first. <b>Booking Account</b>: book results to a different account.</li><li><b>Number of repetitions</b>: for the reciprocal method (service departments charging each other) run several rounds until the source is near zero.</li><li>Drivers can come from prior-year actuals with a calculated account using LOOKUP and an offset.</li></ul>
<h3>Currency conversion setup</h3>
<ul><li><b>Currency conversion table</b> (Modeler → Conversions): source currency, <b>category</b> (Actual, Plan… or Specific with <b>rate versions</b>), <b>rate type</b> (<b>Average</b> for income statement, <b>Closing</b> for balance sheet; only these two).</li><li>Model: activate conversion (adds Rate Type to Account and Rate Version to Version), choose the rate table and the date dimension; optional currency variable for stories.</li><li>Accounts: EXP/INC → Average, LEQ/AST → Closing.</li><li>Measures: <b>local currency</b>, <b>group currency</b>, and <b>converted measures</b> calculated on the fly.</li><li>Conversion step in a data action: date options Booking Date, ±1 or Fixed Date.</li></ul>
<h3>Rolling forecast layout</h3>
<p>Table type <b>Forecast Layout</b>: look-back version (usually Actual) and look-ahead version (Forecast), <b>cut-over date</b> = Today, a Specific Date or Last Booked (Actuals); timeframe (granularity and ranges); totals for the cut-over year, all periods or look-ahead; optional <b>Delta</b> column against another version. A slider input control can move the cut-over.</p>
<h3>Predictive forecasting for planning</h3>
<p>Smart Predict time series straight on the planning model: pick the model, the version to learn from (actuals), the measure, the number of periods and the entities (optionally influencers). Check <b>Horizon-Wide MAPE</b> (lower is better), signal analysis and the confidence band. Results are written to a <b>private version</b> first; review, then publish.</p>
<h3>Value driver trees and Compass</h3>
<div class="grid2"><div class="card"><h3>VDT</h3><ul><li>Create automatically from account formulas/hierarchy, or manually (Add Parent / Add Child).</li><li>Default node settings for all nodes; node-specific calculations possible.</li><li>One date filter for the whole tree; versions can switch via input controls.</li><li>Simulate with a keypad, slider or typing; values are written to the model.</li><li>Not for live models; only planning licences can publish.</li></ul></div>
<div class="card"><h3>Compass</h3><ul><li>Monte Carlo simulation on a target KPI using model relationships.</li><li>Start from the Compass page or right-click a table cell.</li><li>Drivers: min/max range, distribution <b>Normal</b> (default) or <b>Uniform</b>; restricted drivers for one slice.</li><li>Precision: Preview 1,000 / Medium 10,000 / High 100,000 iterations.</li><li>Output: pessimistic, realistic, optimistic cases and a probability slider.</li><li>Private scenarios → publish to public (read-only drivers).</li><li>Needs a planning licence and Compass permission.</li></ul></div></div>
<h3>The calendar planning process</h3>
<div class="grid2"><div class="card"><h3>Roles</h3><ul><li><b>Owner</b>: owns the process, can reopen finished events</li><li><b>Assignee</b>: does the task, opens work files, submits</li><li><b>Reviewer</b>: approves or rejects (unlimited reviewer rounds)</li><li><b>Viewer</b>: can see; people without SAC accounts can be added by email</li></ul></div>
<div class="card"><h3>Event types</h3><ul><li><b>General Task</b>: enter data and submit</li><li><b>Review Task</b>: approve or reject another event's result</li><li><b>Data Action / Multi Action Task</b>: runs automatically</li><li><b>Data Locking Task</b>: changes lock states (the only task that needs a planning model in its context)</li><li><b>Composite Task</b>: being deprecated</li><li>Template-based events (up to 20) and task groups</li></ul></div></div>
<p><b>Typical flow:</b> owner sets locks to Closed → process starts, region set to <b>Open</b> → planner enters data, publishes and submits (lock <b>Restricted</b>) → reviewer approves (lock <b>Locked</b>) or rejects (task back to In Progress) → owner submits the data locking task and finally the process. Tasks can start on a date or when other events reach a status; overdue tasks stay In Progress unless set to discontinue. Views: Calendar, List and <b>Gantt</b> (drag to move dates). Notifications and emails link to the task; discussions can be opened from the process.</p>`,

<h2>How to use this website</h2><div class="grid3"><div class="card"><h3>To learn</h3><p>Go lesson by lesson. Read, do the demo in SAC (a free trial works), then answer the questions before clicking.</p></div><div class="card"><h3>To teach</h3><p>Turn on <b>Presenter mode</b> for big text. Ask the class a question, wait, then click to pop up the answer. Use <b>Random question</b> and the <b>Think timer</b> to keep everyone active.</p></div><div class="card"><h3>To pass</h3><p>Finish all lessons, score 60%+ on the practice exam, then answer every role-play scenario <b>out loud</b>. The real exam is a spoken interview, so practise speaking.</p></div></div>

roleplay:()=>`${hint}<h1>Role-play practice</h1><p>The real C_SAC exam is a <b>conversation</b>. An AI person plays a client or stakeholder, describes a business situation, and asks you questions. Here are ${RP.length} practice scenarios in that style. Read the brief, <b>answer each question out loud</b> (60–90 seconds), then click to compare with the model answer.</p>
<div class="weekhead" style="--c:var(--blue)"><b>Answer with C-L-E-A-R:</b> <b>C</b>larify the need · <b>L</b>ay out the data · <b>E</b>xplain the build (name the SAC features) · <b>A</b>ssure control (security, validation, locking, review) · <b>R</b>esult for the business and one trade-off.<br><b>Score yourself 1–5</b> per answer, like the real exam: 1 = vague, 3 = right feature, 5 = right feature + why + risk + business value.</div>

${RP.map((r,i)=>`<section class="lesson" id="rp-${i+1}"><div class="tag" style="--c:var(--blue)"><span class="dot"></span>Scenario ${i+1} of ${RP.length}</div><h2 class="lt">${r.t}</h2><div class="card keyc" style="--c:var(--blue)"><h3>Your stakeholder: ${r.who}</h3><p>${r.brief}</p></div><div class="qtools" data-scope="rp-${i+1}"><button class="btn" type="button" data-all="show">Show model answers</button><button class="btn" type="button" data-all="hide">Hide them</button></div>${r.qs.map((q,k)=>qaHTML({q:q[0],a:`<p>${q[1]}</p>`},"rp"+i+"q"+k,k+1)).join("")}</section>`).join("")}

all:()=>`${hint}<h1>All weeks on one page</h1><p>The full course in one long page: every week, every lesson and every question. Use the week buttons at the top to jump to a single week instead.</p><div class="weekhead" style="--c:var(--ink)"><b>Jump to:</b> ${WEEKS.map((w,k)=>`<a href="#all" data-jump="aw-${k+1}">Week ${k+1}</a>`).join(" · ")} · <a href="#all" data-jump="aw-test">Practice exam</a></div>${WEEKS.map((w,k)=>`<section class="allweek" id="aw-${k+1}" style="--c:${w.c}"><div class="tag" style="--c:${w.c}"><span class="dot"></span>Week ${k+1} of ${WEEKS.length}</div><h1>Week ${k+1}: ${w.t}</h1><p class="goal" style="--c:${w.c}">${w.goal}</p>${weekHead(k)}${weekBody(k)}</section>`).join("")}<section class="allweek" id="aw-test" style="--c:var(--ink)"><h1>Practice exam</h1>${testBody()}</section>${navBtns("all")}`,

<h2>Video script for each lesson (10–15 minutes)</h2><div class="grid2"><div class="card"><h3>1. Hook (30 sec)</h3><p>Start with a business problem: "Your budget lives in 30 Excel files. Today we fix that in SAC."</p></div><div class="card"><h3>2. Explain (4 min)</h3><p>Read the lesson goal and walk through the cards and tables in Presenter mode.</p></div><div class="card"><h3>3. Live demo (4 min)</h3><p>Share your SAC screen and follow the demo steps. Show one mistake and how to fix it.</p></div><div class="card"><h3>4. Questions (3 min)</h3><p>Read each question, pause 3 seconds ("pause the video and think"), then click to pop up the answer.</p></div><div class="card"><h3>5. Role-play minute (1 min)</h3><p>Read one role-play question and answer it out loud with C-L-E-A-R, so viewers hear what a good spoken answer sounds like.</p></div><div class="card"><h3>Recording tips</h3><ul><li>Use Presenter mode and full-screen your browser.</li><li>Zoom the browser to 110–125% for clear text.</li><li>Press <span class="kbd">H</span> to hide answers before you record.</li><li>Use sample data, never real company data.</li></ul></div></div>

const setQA=(el,open,pick)=>{el.classList.toggle("open",open);el.querySelector(".qhead").setAttribute("aria-expanded",open);el.querySelector(".qtext small").textContent=open?"Click again to hide the answer":"Click to see the answer";
 const r=+el.dataset.r,you=el.querySelector(".you");el.querySelectorAll(".opt").forEach(b=>b.classList.remove("wrong"));
 if(open&&pick!==undefined&&r>=0){el.dataset.p=pick;if(pick!==r)el.querySelector(`.opt[data-j="${pick}"]`).classList.add("wrong");you.textContent=pick===r?"You got it right!":"Not quite. Your pick was "+L[pick]+"."}else{delete el.dataset.p;you.textContent=""}
 score()};
const score=()=>{const s=$("score");if(!s)return;let c=0,a=0;const by=DOMAINS.map(()=>[0,0]);document.querySelectorAll("#testq .qa").forEach((q,i)=>{if(q.dataset.p===undefined)return;a++;const ok=+q.dataset.p===+q.dataset.r;if(ok)c++;const d=TEST[i][4];by[d][1]++;if(ok)by[d][0]++});
 s.textContent=`Score: ${c} / ${TEST.length}`+(a===TEST.length?(c>=Math.ceil(TEST.length*0.6)?" · Above the 60% pass mark. Keep practising your weakest area.":" · Below the 60% pass mark. Review your weakest areas and try again."):"");
 const dm=$("dom");if(dm)dm.innerHTML="<b>Score by topic area</b>"+DOMAINS.map((n,d)=>{const t=TEST.filter(x=>x[4]===d).length,[ok,done]=by[d],w=done?Math.round(ok/done*100):0;return `<div style="display:grid;grid-template-columns:minmax(0,1fr) 7em;gap:10px;align-items:center;margin-top:8px"><div><div style="font-size:15px">${d+1}. ${n}</div><div style="height:8px;background:var(--bg);border:1px solid var(--edge);border-radius:4px;overflow:hidden"><i style="display:block;height:100%;width:${w}%;background:${w>=60?"var(--ok)":"var(--amber)"}"></i></div></div><div style="text-align:right;font-weight:700;white-space:nowrap">${ok} / ${done} of ${t}</div></div>`}).join("")};
const allQA=open=>document.querySelectorAll("#view .qa").forEach(q=>setQA(q,open));
const scrollTo2=id=>{const el=$(id);if(el)el.scrollIntoView({behavior:"smooth",block:"start"})};
const mark=()=>{document.querySelectorAll("#rail a[data-v],#tabs a").forEach(a=>a.classList.toggle("on",a.dataset.v===cur));const t=document.querySelector("#tabs a.on");if(t)t.scrollIntoView({block:"nearest",inline:"center"})};
const go=()=>{let v=(location.hash||"#home").slice(1);
 const m=v.match(/^lesson-(\d+)$/);if(m&&LESSONS[+m[1]-1]){pending=+m[1];v="week-"+(weekOf(+m[1]-1)+1)}
 if(!ORDER.includes(v))v="home";cur=v;
 $("view").innerHTML=v.startsWith("week-")?weekView(+v.slice(5)-1):views[v]();
 mark();$("b-all").textContent="Show all answers";pb();document.body.classList.toggle("printcert",v==="cert");
 if(pending){const p=pending;pending=null;setTimeout(()=>scrollTo2("les-"+p),30)}else window.scrollTo(0,0)};
const pb=()=>{const f=$("pb");if(!f)return;const v=id=>$(id).value.trim();const b=()=>{const L=["Task: "+v("pb-task")+"."];
 if(v("pb-ctx"))L.push("","Context: "+v("pb-ctx"));if(v("pb-ex"))L.push("","Example of the style I like: \""+v("pb-ex")+"\"");
 if(v("pb-con"))L.push("","Constraints: "+v("pb-con")+".");if(v("pb-role"))L.push("","Role and tone: "+v("pb-role")+".");
 if($("pb-steps").checked)L.push("","Let's do this in steps: first show me a short outline, and wait for my OK before writing the full version.");
 if($("pb-think").checked)L.push("","Before you answer, think step by step about what will work best.");
 L.push("","If anything is unclear, ask me up to 3 short questions first.");$("pb-out").textContent=L.join("\n")};
 f.addEventListener("input",b);f.addEventListener("change",b);f.addEventListener("submit",e=>e.preventDefault());b();
 $("pb-copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText($("pb-out").textContent);$("pb-msg").textContent="Copied. Paste it into SAC."}catch(e){$("pb-msg").textContent="Copy is blocked here. Select the text and copy it."}})};
let think=store.get("sac1-think",0);
const stopT=q=>{if(q._t){clearInterval(q._t);q._t=null}};
const openQ=q=>{if(q.classList.contains("open")||q._t)return;if(!think){setQA(q,true);return}
 let s=think;const sm=q.querySelector(".qtext small");const tick=()=>{sm.innerHTML=`<span class="count">${s}</span> Think about your answer…`};tick();
 q._t=setInterval(()=>{s--;if(s<=0){stopT(q);setQA(q,true)}else tick()},1000)};
const qaClick=e=>{const h=e.target.closest(".qhead");if(h){const q=h.closest(".qa");if(q.classList.contains("open"))setQA(q,false);else if(q._t){stopT(q);setQA(q,true)}else openQ(q);return true}
 const o=e.target.closest(".opt");if(o){const q=o.closest(".qa");if(q.classList.contains("open"))return true;stopT(q);setQA(q,true,+o.dataset.j);return true}return false};
const setThink=t=>{think=t;store.set("sac1-think",t);$("b-think").textContent="Think timer: "+(t?t+" sec":"off");$("b-think").setAttribute("aria-pressed",!!t)};
$("b-think").addEventListener("click",()=>setThink(think?0:5));setThink(think);
/* random question */
const POOL=[...LESSONS.flatMap((l,i)=>l.qs.map(q=>({q,src:"Lesson "+(i+1)+": "+l.t}))),...TEST.map(t=>({q:{q:t[0],o:t[1],r:t[2],a:`<p>${t[3]}</p>`},src:"Practice exam"})),...RP.flatMap((r,i)=>r.qs.map(q=>({q:{q:q[0],a:`<p>${q[1]}</p>`},src:"Role-play "+(i+1)+": "+r.t})))];
let lastR=-1;
const showRand=()=>{let k;do{k=Math.floor(Math.random()*POOL.length)}while(k===lastR&&POOL.length>1);lastR=k;const p=POOL[k];
 $("spotsrc").textContent=p.src;$("spotq").innerHTML=qaHTML(p.q,"spotqa","?");$("spot").hidden=false;
 const box=document.querySelector(".spotbox");box.style.animation="none";void box.offsetWidth;box.style.animation="";$("spot-x").focus()};
const closeSpot=()=>{const q=$("spotqa");if(q)stopT(q);$("spot").hidden=true;$("b-rand").focus()};
$("b-rand").addEventListener("click",showRand);
$("spot").addEventListener("click",e=>{if(qaClick(e))return;if(e.target.id==="spot-x"||e.target.id==="spot")closeSpot();else if(e.target.id==="spot-next")showRand()});
/* search */
const strip=s=>s.replace(/<[^>]+>/g," ").replace(/\s+/g," ").toLowerCase();
const doSearch=()=>{const t=$("q").value.trim().toLowerCase();if(t.length<2){if(cur==="search")go();return}cur="search";mark();
 const hits=[];LESSONS.forEach((l,i)=>{if(strip(l.t+" "+l.s+" "+l.goal+" "+l.body+" "+KEYS[i].join(" ")+" "+DEMOS[i].map(d=>d.t+" "+d.s.join(" ")).join(" ")).includes(t))hits.push({i,txt:"Lesson "+(i+1)+": "+l.t,sub:"Week "+(weekOf(i)+1)+" · "+l.s});
  l.qs.forEach((q,k)=>{if(strip(q.q+" "+q.a).includes(t))hits.push({i,txt:"Q"+(k+1)+": "+q.q,sub:"Question in lesson "+(i+1)+": "+l.t})})});
 const g=GLOSS.filter(r=>strip(r.join(" ")).includes(t));
 $("view").innerHTML=`<h1>Search: “${t.replace(/</g,"&lt;")}”</h1><p style="color:var(--soft)">${hits.length+g.length} results</p>${hits.map(h=>`<a class="sr" href="#week-${weekOf(h.i)+1}" data-sr="${h.i+1}">${h.txt}<small>${h.sub}</small></a>`).join("")}${g.map(r=>`<a class="sr" href="#words">${r[0]}<small>Easy words · ${r[1]}</small></a>`).join("")}${hits.length+g.length?"":`<p>No results. Try a simpler word, like "model", "version" or "filter".</p>`}`};
let sT;$("q").addEventListener("input",()=>{clearTimeout(sT);sT=setTimeout(doSearch,200)});
$("view").addEventListener("click",e=>{const a=e.target.closest("a[data-sr]");if(!a)return;e.preventDefault();$("q").value="";pending=+a.dataset.sr;const h=a.getAttribute("href");if(location.hash===h)go();else location.hash=h});
$("view").addEventListener("click",async e=>{const b=e.target.closest("[data-dcopy]");if(!b)return;const [a,c,k]=b.dataset.dcopy.split("-").map(Number);const m=b.parentNode.querySelector(".cmsg");try{await navigator.clipboard.writeText(DEMOS[a][c].s[k]);m.textContent="Copied! Paste it into SAC."}catch(x){m.textContent="Copy blocked here. Select the text and copy it."}});
$("view").addEventListener("click",async e=>{const b=e.target.closest("[data-copy]");if(!b)return;const m=b.parentNode.querySelector(".cmsg");try{await navigator.clipboard.writeText(LIB[+b.dataset.copy][2]);m.textContent="Copied! Paste it into SAC."}catch(x){m.textContent="Copy blocked here. Select the text and copy it."}});
$("view").addEventListener("input",e=>{if(e.target.id!=="cert-name")return;const v=e.target.value;$("cert-show").textContent=v||"Student Name";store.set("sac1-name",v)});
$("view").addEventListener("click",e=>{if(e.target.id!=="cert-print")return;$("cert-msg").textContent="If no print window opens, download the .html file, open it, and press Ctrl + P.";try{window.print()}catch(x){}});
$("view").addEventListener("click",e=>{if(qaClick(e))return;
 const a=e.target.closest("[data-all]");if(a){const sc=a.closest("[data-scope]");const box=sc?$(sc.dataset.scope):$("view");box.querySelectorAll(".qa").forEach(q=>setQA(q,a.dataset.all==="show"));return}
 if(e.target.id==="treset"){$("testq").querySelectorAll(".qa").forEach(q=>setQA(q,false));return}
 const j=e.target.closest("[data-jump]");if(j){e.preventDefault();scrollTo2(j.dataset.jump)}});
document.addEventListener("click",e=>{const a=e.target.closest("a[data-les]");if(!a)return;const href=a.getAttribute("href");if(location.hash===href||(!location.hash&&href==="#home")){e.preventDefault();scrollTo2("les-"+a.dataset.les)}else pending=+a.dataset.les});
$("view").addEventListener("change",e=>{const k=e.target.dataset.done;if(!k)return;done[k]=e.target.checked;store.set("sac1-done",done);rail();mark()});
$("b-all").addEventListener("click",()=>{const open=$("b-all").textContent.startsWith("Show");allQA(open);$("b-all").textContent=open?"Hide all answers":"Show all answers"});
const setPresent=p=>{document.body.classList.toggle("present",p);$("b-present").setAttribute("aria-pressed",p);store.set("sac1-present",p)};
$("b-present").addEventListener("click",()=>setPresent(!document.body.classList.contains("present")));
document.addEventListener("keydown",e=>{if(e.target.closest("input,textarea,select")||e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase();
 if(k==="f"){const d=document;try{const p=d.fullscreenElement?d.exitFullscreen():d.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>{})}catch(x){}return}
 if(!$("spot").hidden){if(k==="escape")closeSpot();else if(k==="r")showRand();else if(k==="n"){const q=$("spotqa");if(q)openQ(q)}return}
 if(k==="r"){showRand();return}
 const i=ORDER.indexOf(cur);
 if(e.key==="ArrowRight"&&ORDER[i+1])location.hash=ORDER[i+1];
 else if(e.key==="ArrowLeft"&&ORDER[i-1])location.hash=ORDER[i-1];
 else if(k==="n"){const q=document.querySelector("#view .qa:not(.open)");if(q){openQ(q);q.scrollIntoView({behavior:"smooth",block:"center"})}}
 else if(k==="h"){document.querySelectorAll("#view .qa").forEach(stopT);allQA(false)}});
window.addEventListener("hashchange",go);
const hh=()=>{const h=document.querySelector('.top').offsetHeight;document.documentElement.style.setProperty('--hh',h+'px');document.documentElement.style.scrollPaddingTop=(h+12)+'px'};const hro=new ResizeObserver(hh);hro.observe(document.querySelector('.top'));
setPresent(store.get("sac1-present",false));rail();go();
}
</script>
</body>
</html>
