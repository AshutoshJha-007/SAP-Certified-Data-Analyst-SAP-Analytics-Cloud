["How will you get the data into SAP Analytics Cloud?","Because the data is already modeled in Datasphere, I would use a <b>live connection</b> to the Datasphere model. Data stays in Datasphere, is always fresh, and we don't build a second copy. If we later need planning, we can add a planning model or seamless planning."],
["How do you make sure a manager sees only their region?","Security should sit with the data, not the story. On a live source, I use the source's data access (for example Datasphere data access controls by Region) combined with SAC roles. Sharing the story then never shows more than each person is allowed to see."],
["What will the dashboard look like?","A <b>responsive page</b> so it works on phones. On top, numeric point KPIs for Revenue, Margin % and growth vs last year, with <b>thresholds</b> (red/amber/green). Below, a sorted bar chart by shop, a line chart for the monthly trend, and an <b>input control</b> for product category. Titles state the finding."],
["The page is slow on mobile. What do you do?","Run the <b>Performance Analysis Tool</b> to find slow widgets. Then reduce widgets per page (move detail to a second page), filter early with page filters, use Top N, and avoid heavy story calculations. On a live source I'd also check the Datasphere model's performance."]]},
{t:"Budget season",who:"Marco, Financial Controller, manufacturing company",brief:"Budgets are built in 30 Excel files that are emailed around. Marco wants planners to enter the 2027 budget by cost centre in SAC, starting from 2026 actuals, with a firm deadline and a review by department heads.",qs:[
["What kind of model do you need?","A <b>planning model</b> with a Version dimension (Actual, Budget 2027) and a Date dimension, plus Account and Cost Centre (organization) dimensions. Actuals are imported on a schedule, or we use seamless planning with Datasphere."],
["How do planners start from last year's actuals?","A <b>data action</b> with a <b>Copy</b> step from Actual 2026 into Budget 2027 (shifting the year), optionally followed by an <b>advanced formula</b> for a growth rate. A data action trigger button in the planning story lets the controller run it, using parameters for year and version."],
["How do you control the deadline and the review?","A <b>calendar process</b>: input tasks for each cost centre owner, then <b>review/approval</b> tasks for department heads. At the deadline a <b>data locking</b> task sets the Budget slices to Restricted (owner only) or Locked. Validation rules prevent invalid combinations."],
["A planner says 'my numbers disappeared'. What happened most likely?","They probably edited in <b>edit mode</b> and didn't <b>Publish</b>, or they reverted. I'd check version management. I'd also train them: edit → check → Publish, and use private versions for experiments."]]},
{t:"Forecast every month",who:"Aisha, FP&A Manager, consumer goods",brief:"Every month the team updates a 12-month rolling forecast by product and market. It takes 4 days of manual work. Aisha wants it faster and more data-driven, with numbers in EUR and USD.",qs:[
["How do you show a rolling forecast?","In the planning table I use the <b>forecast layout</b>: past months show Actual and future months show the Forecast version, split at a <b>cut-over date</b> that moves forward each month. So we always see 12 months ahead."],
["How can the first draft be data-driven?","Use <b>predictive forecasting</b>: a time-series forecast (Smart Predict, or the predictive step) based on history writes a suggested forecast into the version. Planners then adjust it with their market knowledge."],
["How do you automate the monthly steps?","A <b>multi action</b>: data import of new actuals → data action to copy and prepare the forecast → predictive step → currency conversion → publish version. One click, or scheduled through a calendar task."],
["How do you handle EUR and USD?","Maintain a <b>currency rate table</b> (rates by date and rate type, for example average rates). In a new model, use <b>conversion measures</b> to show local and USD values side by side; in planning, a currency conversion step can write converted values."]]},
{t:"Cost allocation",who:"Tom, Shared Services Lead",brief:"Central IT and facility costs (12 million) are in one cost centre. Business units complain they don't know what they pay for. Tom wants fair, transparent allocation in the plan.",qs:[
["How do you allocate the costs?","An <b>allocation step</b> in a data action: source = central IT and facility cost, targets = business unit cost centres, driver = headcount for IT and square metres for facilities. Allocations can run in several stages."],
["How do business units see where costs come from?","A story with a table by business unit and a <b>waterfall chart</b> from direct costs to fully allocated costs, plus <b>data point comments</b> explaining the drivers. Each unit sees only its data through data access control."],
["What if the driver data is wrong?","The result is wrong too, so I add checks: validate driver data before running, show the driver values in the story, and test the data action on a <b>private version</b> first."]]},
{t:"Two models, one view",who:"Lena, Marketing Director",brief:"Campaign spend is in a marketing model; sales are in a sales model. Both have Product and Month. Lena wants to see return on marketing spend by product.",qs:[
["How do you put both in one chart?","<b>Blending</b>: build the chart on the sales model, add the marketing model and <b>link dimensions</b> on Product and Month. Then I can show Revenue and Spend side by side."],
["How do you calculate the return?","A <b>calculated measure</b> in the blended widget, for example Revenue / Spend, with an IF to avoid dividing by zero. If many stories need it, it's better to model it centrally."],
["Product IDs don't match between the two models. What now?","Linked dimensions need matching members. Fix the IDs at the source or in data preparation (mapping), or create a mapping in the data layer (for example in Datasphere) so both use the same product master."]]},
{t:"Self-service for managers",who:"David, COO",brief:"Managers keep emailing analysts for small numbers. David wants managers to answer simple questions themselves and understand surprises without waiting.",qs:[
["Which SAC features help?","<b>Just Ask</b> and <b>Joule</b> for questions in plain language, <b>Smart Insights</b> to explain why a number moved, and <b>bookmarks</b> or a curated <b>Catalog</b> so they start from trusted stories."],
["What must be in place for good answers?","Clear model and member names and descriptions, models enabled and indexed for natural-language queries, and correct data access so answers respect security. Short training helps too."],
["A manager trusts an AI answer that looks wrong. What do you advise?","AI answers are a starting point. Check the filters and the model behind the chart, compare with the trusted story, and ask an analyst if it still looks wrong. For important decisions, a human checks."]]},
{t:"What-if for the board",who:"Sophie, CFO",brief:"The board asks: 'If raw material prices rise 10% and volumes are uncertain, what happens to profit, and how likely are we to hit the target?'",qs:[
["How do you show the effect of a 10% price rise?","A <b>value driver tree</b> linking material price, volume, revenue and cost up to profit. I change the price driver by +10% in a private version and see the profit impact flow up the tree."],
["How do you show how likely the target is?","<b>SAP Analytics Cloud Compass</b>: I enter ranges for uncertain drivers (volume, price), and Compass runs Monte Carlo simulations to show the spread of outcomes and the probability of reaching the target."],
["How do you keep the official plan safe?","All simulation happens in <b>private versions</b> or simulation scenarios. Only an agreed scenario is published, maybe with Publish As as a new version."]]},
{t:"Predict customer churn",who:"Ravi, Customer Success Manager, subscription business",brief:"Ravi has 3 years of customer data (usage, tickets, contract length, cancelled yes/no). He wants a list of customers likely to cancel next quarter.",qs:[
["Which Smart Predict type?","<b>Classification</b>, because the target is yes/no (cancelled). It gives each customer a probability of cancelling."],
["How do you build it?","Prepare a clean <b>dataset</b> with history and the known outcome, create a classification predictive scenario, train it, check the quality indicators (predictive power, prediction confidence) and top influencers, then apply it to current customers."],
["How do you use the result?","Save predictions to a dataset, show high-risk customers in a story table sorted by probability with thresholds, and share it with the success team. Re-train regularly and track whether the predictions were right."]]},
{t:"Messy data upload",who:"Nina, Analyst, small company with no data warehouse",brief:"Nina has monthly Excel exports from an online shop: dates as text, 'City, Country' in one column, some empty product IDs. She wants reliable monthly reports.",qs:[
["How do you get the data in?","<b>Import</b> the file into a new model. During data preparation (<b>wrangling</b>) I change the date column to a real date, split 'City, Country' into two columns, and fix or remove rows without product IDs."],
["How do you keep it updated?","If the shop or a database is reachable, set up an <b>import job with a schedule</b>. If it stays as files, define a fixed file layout and reuse the same import steps each month."],
["Why build a model, not just a dataset?","Because reports are reused monthly: a model gives proper dimensions, hierarchies (Country → City), shared calculations and security. A dataset is fine for a quick one-off test."]]},
{t:"Rescue a slow, confusing story",who:"Ben, IT Business Partner",brief:"A big sales story has 1 page with 30 charts, rainbow colours, and takes 40 seconds to open. Users stopped using it.",qs:[
["What do you change first?","Find the cause with the <b>Performance Analysis Tool</b>, then split the content into pages by question (overview, regions, products), keep 6–8 widgets per page, add page filters and Top N, and remove duplicate charts."],
["How do you make it clearer?","KPIs with <b>thresholds</b> on top, detail below, one company <b>theme</b>, colour sync, titles that state the finding, and <b>input controls</b> instead of many near-identical charts."],
["How do you check it worked?","Measure load time before and after, ask 3 to 5 users to try a real question, and watch usage over the next weeks."]]}
];

{m:2,d:2,t:"Reporting deep dive 1: tables, charts, maps and formatting",s:"Every widget setting you need for real reports",
goal:"By the end, you can build and format any table or chart the way a finance or sales team expects, add variances, apply IBCS-style notation, configure geo maps and other widgets, and sort data in every way SAC allows.",
body:`<p>This lesson follows SAP's story design course (SACS21): configuring tables, charts, geo maps, conditional formatting, other widgets, preferences and sorting. These are the everyday skills of a <b>reporting</b> person.</p>
<h3>Tables in depth</h3>
<div class="grid2"><div class="card"><h3>Building a table</h3><ul><li>Add a table → pick the model → use the <b>Builder</b> panel.</li><li>Put dimensions in <b>Rows</b> and <b>Columns</b>; measures or accounts go in the data area (the measure dimension can sit in rows or columns).</li><li><b>Swap axis</b> to turn rows into columns in one click.</li><li>Pick a <b>hierarchy</b> and a drill level for each dimension; expand and collapse nodes.</li><li>Show or hide <b>totals</b>, choose where totals appear.</li><li>Use <b>Show/Hide</b> to hide empty rows or columns (zero suppression).</li></ul></div>
<div class="card"><h3>Formatting a table</h3><ul><li><b>Number format</b>: scale (thousands, millions), decimals, show sign, units and currency.</li><li><b>Styling</b>: header colours, row lines, fonts, alternate row colour, freeze rows/columns.</li><li><b>In-cell charts</b>: little bars or variance bars inside cells.</li><li><b>Resize and wrap</b> columns, rename headers for readers.</li><li>Use the <b>table template/style</b> so all tables look the same.</li></ul></div>
<div class="card"><h3>Variance in tables</h3><p>Compare two versions or periods, for example <b>Actual vs Budget</b> or <b>2026 vs 2025</b>. Use <b>Add Variance</b> (or a Difference-from calculation) to get the absolute and the % difference. Choose whether a <b>higher</b> value is good or bad, so colours make sense (higher revenue = good, higher cost = bad).</p></div>
<div class="card"><h3>Conditional formatting on tables</h3><p>Apply <b>thresholds</b> to <b>one cell, a range, or many cells</b>. Show the result as cell colour, text colour or a symbol. Ranges can be fixed numbers or compare to another measure (for example "Actual &lt; 90% of Budget").</p></div></div>
<h3>Charts in depth</h3>
<div class="scroll"><table class="stack"><thead><tr><th>Setting</th><th>What it does</th><th>Tip</th></tr></thead><tbody>
<tr><td>Builder: measures, dimensions, colour</td><td>Choose what's on each axis and what colours the bars</td><td>Use "Color" for a second dimension only when it adds meaning</td></tr>
<tr><td>Combination chart</td><td>Columns + a line, often with a second (dual) axis</td><td>Revenue as columns, Margin % as a line</td></tr>
<tr><td>Variance</td><td>Shows the difference between two versions or periods right on the chart</td><td>Actual vs Budget as variance bars or a variance waterfall</td></tr>
<tr><td>Reference lines</td><td>A fixed or dynamic line, e.g. target or average</td><td>Makes "above / below target" obvious</td></tr>
<tr><td>Data labels and tooltip</td><td>Values on the chart; extra measures in the tooltip</td><td>Label only what matters; avoid clutter</td></tr>
<tr><td>Axis scaling</td><td>Min/max, and <b>synchronise</b> scales across charts</td><td>Same scale = fair comparison</td></tr>
<tr><td>Ranking and sorting</td><td>Top N, sort by value</td><td>Most charts read best sorted</td></tr>
<tr><td>Time-series forecast</td><td>Automatic forecast on a line/time-series chart</td><td>Show the forecast range, not just the line</td></tr>
<tr><td>Chart scaling across widgets</td><td>Keep the same scale for several charts with the same unit</td><td>Avoids a small number looking big</td></tr></tbody></table></div>
<h3>IBCS: a standard way to show business numbers</h3>
<p><b>IBCS</b> (International Business Communication Standards) is a set of rules for clear business charts. SAC supports IBCS-style notation, especially in variance charts and tables.</p>
<div class="grid2"><div class="card"><h3>IBCS notation</h3><ul><li><b>Actual</b>: solid dark fill</li><li><b>Plan / Budget</b>: outlined (empty) bars</li><li><b>Previous year</b>: light grey fill</li><li><b>Forecast</b>: hatched (striped) fill</li><li>Positive variance <b>green</b>, negative <b>red</b></li><li>Time runs <b>horizontally</b>; categories (products, regions) run <b>vertically</b></li></ul></div>
<div class="card"><h3>Why it matters</h3><p>Readers learn the code once and then understand every report instantly. In exam scenarios, mentioning consistent notation, scaling and variance colours shows you design reports for decision makers, not for decoration.</p></div></div>
<h3>Geo maps in depth</h3>
<div class="grid2"><div class="card"><h3>Layers</h3><ul><li><b>Bubble</b>: circle size = value (sales by city)</li><li><b>Choropleth</b>: areas coloured by value (sales by country)</li><li><b>Heat map</b>: density of many points</li><li><b>Flow</b>: lines from origin to destination (shipments)</li><li><b>Point of interest</b>: your own locations (stores, warehouses)</li></ul></div>
<div class="card"><h3>Setup and interaction</h3><ul><li>The model needs a <b>location dimension</b> (lat/long or area names).</li><li>Choose a <b>base map</b> (light, dark, satellite, etc.).</li><li>Turn on <b>clustering</b> for many points.</li><li>Filter by selecting areas (lasso / polygon) and use the map for <b>linked analysis</b>.</li></ul></div></div>
<h3>Other widgets</h3>
<div class="scroll"><table class="stack"><thead><tr><th>Widget</th><th>Use it for</th></tr></thead><tbody>
<tr><td>Text with dynamic text</td><td>Titles that update by themselves: add story filters, input control values, model variables or calculated values into the text ("Revenue for <i>EMEA</i>, <i>2026</i>")</td></tr>
<tr><td>Image and shape</td><td>Logos, icons, background panels</td></tr>
<tr><td>Numeric point</td><td>KPI tiles with primary and secondary values (Actual and variance)</td></tr>
<tr><td>Input control</td><td>Member or range filters for viewers; can be <b>cascading</b> (picking a country limits the city list)</td></tr>
<tr><td>Web page</td><td>Embed an allowed web page</td></tr>
<tr><td>R visualization</td><td>Special charts written in R</td></tr>
<tr><td>Comment widget</td><td>A space for written commentary on a page</td></tr>
<tr><td>Containers (panel, tab strip, flow layout)</td><td>Group widgets, show tabs, build responsive layouts</td></tr></tbody></table></div>
<h3>Sorting: three kinds</h3>
<div class="grid3"><div class="card"><h3>Value sorting</h3><p>Sort members by a measure, highest or lowest first.</p></div><div class="card"><h3>Advanced sorting</h3><p>Sort by a measure in a specific column or context, or keep hierarchy order while sorting inside each parent.</p></div><div class="card"><h3>Custom sorting</h3><p>Drag members into your own order, for example North, South, East, West or a fixed product order.</p></div></div>
<h3>Preferences</h3>
<p><b>Story preferences</b> (or story details/settings) set defaults for the whole story: page size, background, default fonts and colours for widgets, number formats and the theme. Set them <b>first</b> so every new widget already looks right. Viewers' own <b>user preferences</b> (language, number and date formats) can change how numbers display for them.</p>`,
say:"Tables and charts tell the story; variances, IBCS notation and consistent scaling make it instantly readable.",
act:"Build a table Actual vs Budget by Region with a variance column, scale in thousands, red/green thresholds. Then build the same as a variance bar chart with IBCS colours and a reference line for the target.",
qs:[
{q:"Your table shows 1,234,567.89. Managers want '1.2 M'. Which setting?",o:["Number format: scale to millions, 1 decimal","A new model","A calculated dimension","Data locking"],r:0,a:`<p>Use the <b>number format</b> settings: scale (millions) and decimals.</p>`},
{q:"In IBCS notation, how is the Budget (plan) usually shown?",o:["Solid dark bars","Outlined (empty) bars","Hatched bars","Light grey bars"],r:1,a:`<p><b>Outlined</b> bars for plan/budget. Actual is solid dark, previous year is light grey, forecast is hatched.</p>`},
{q:"You show Revenue (millions) and Margin % in one chart. Which chart type and setting?",o:["Pie chart","Combination chart with a second axis","Geo map","Waterfall only"],r:1,a:`<p>A <b>combination chart</b>: Revenue as columns, Margin % as a line on a <b>second (dual) axis</b>.</p>`},
{q:"Three small charts compare costs of three plants. One plant looks huge but isn't. What fix?",o:["Synchronise the axis scale across the charts","Use 3D","Remove labels","Change colours"],r:0,a:`<p><b>Synchronise / share the scale</b> across charts with the same unit, so sizes are comparable.</p>`},
{q:"You need sales by country, with countries coloured by value. Which geo map layer?",o:["Bubble","Choropleth","Flow","Heat map"],r:1,a:`<p>A <b>choropleth</b> layer colours areas by value.</p>`},
{q:"Your chart title must always say which region the user filtered. What do you use?",o:["Dynamic text in a text widget","Retype the title every time","A data action","A theme"],r:0,a:`<p><b>Dynamic text</b> inserts filter values, input control selections or variables into the text automatically.</p>`},
{q:"Management wants regions always in the order North, South, East, West. Which sorting?",o:["Value sorting","Custom sorting","Advanced sorting","No sorting"],r:1,a:`<p><b>Custom sorting</b> lets you set your own member order.</p>`},
{q:"Why set story preferences before adding widgets?",a:`<p>So every new widget already uses the right fonts, colours, number formats and theme. This saves time and keeps the story consistent.</p>`}
]},
{m:2,d:3,t:"Reporting deep dive 2: filters, prompts, bookmarks, export and sharing",s:"Make reports interactive, reusable and delivered on time",
goal:"By the end, you can use every kind of filter and prompt, build stories from files and templates, create bookmarks, present on screens and phones, and export or schedule reports.",
body:`<h3>Data sources for stories</h3>
<div class="grid3"><div class="card"><h3>Model</h3><p>The normal, reusable choice (import or live). Shared calculations and security.</p></div><div class="card"><h3>File (Excel/CSV)</h3><p>Start a story straight from a file. SAC creates an embedded dataset inside the story. Quick, but not reusable or governed.</p></div><div class="card"><h3>Template</h3><p>Start from a layout with placeholders, then add your data. Keeps all reports consistent.</p></div></div>
<h3>Filters: the full picture</h3>
<div class="scroll"><table class="stack"><thead><tr><th>Filter</th><th>Scope</th><th>Typical use</th></tr></thead><tbody>
<tr><td>Story filter (filter bar)</td><td>All pages and widgets on the same model(s)</td><td>Year, company code for the whole report</td></tr>
<tr><td>Page filter / input control</td><td>All widgets on one page (or chosen ones)</td><td>Let viewers pick a region</td></tr>
<tr><td>Widget filter</td><td>One chart or table</td><td>This chart shows only Bikes</td></tr>
<tr><td>Linked analysis</td><td>Click-to-filter across chosen widgets</td><td>Click Germany, all charts follow</td></tr>
<tr><td>Range / date filter</td><td>Numbers or dates between limits</td><td>Revenue between 1 and 5 million</td></tr>
<tr><td>Dynamic date filter</td><td>Moves with today's date</td><td>Current month, last 12 months, year to date</td></tr>
<tr><td>Cascading input controls</td><td>One filter limits the next</td><td>Country → City</td></tr></tbody></table></div>
<p>Input controls can allow <b>single or multiple</b> selection, show IDs or descriptions, show only <b>booked values</b>, and be <b>linked</b> across models with linked dimensions.</p>
<h3>Prompts and variables</h3>
<div class="grid2"><div class="card"><h3>What they are</h3><p>Live SAP BW and SAP HANA sources (and some SAC models) can have <b>variables</b>: questions the data source asks before it returns data, for example "Which fiscal year?". SAC shows them in a <b>prompt dialog</b>.</p></div>
<div class="card"><h3>How to handle them</h3><ul><li>Set default values so the story opens fast.</li><li>Choose whether the prompt opens automatically when the story opens.</li><li>Link the same variable across several models so users answer once.</li><li>Viewers can re-open the prompt to change values.</li><li>In scripts: <code>setVariableValue()</code> and <code>openPromptDialog()</code> (next lessons).</li></ul></div></div>
<h3>Bookmarks</h3>
<p>A <b>bookmark</b> saves the current state of a story: filters, input control selections, drill states, sometimes the page. <b>Personal</b> bookmarks are for you; <b>global</b> bookmarks are shared with everyone who can open the story. You can mark one as the <b>default</b> so the story opens that way. Use them instead of copying the same story ten times with different filters.</p>
<h3>Presenting</h3>
<div class="grid3"><div class="card"><h3>Present mode</h3><p>Full-screen view that hides edit tools. Good for meetings.</p></div><div class="card"><h3>Mobile</h3><p>Use <b>responsive pages</b>, test with <b>device preview</b>, keep fewer widgets, and open the story in the SAC mobile app (iOS / Android).</p></div><div class="card"><h3>Digital Boardroom</h3><p>Presents stories as an agenda or dashboard on big touch screens for board meetings (check it's available in your tenant).</p></div></div>
<h3>Export and delivery</h3>
<div class="scroll"><table class="stack"><thead><tr><th>Option</th><th>Result</th><th>Notes</th></tr></thead><tbody>
<tr><td>Export to PDF</td><td>Pages as a PDF</td><td>Choose pages, paper size, include an appendix with filters and comments</td></tr>
<tr><td>Export to PowerPoint</td><td>Pages as slides</td><td>Good for meetings</td></tr>
<tr><td>Export data (CSV / XLSX)</td><td>Data of a table or chart</td><td>Choose all data or only the point of view; formatted or raw values</td></tr>
<tr><td>Schedule publication</td><td>Story sent as PDF/PowerPoint by email, once or repeating</td><td>Recipients can include SAC users (each sees their own data) and other email addresses; needs the right permission</td></tr>
<tr><td>Share link / Catalog</td><td>People open the live story</td><td>Always up to date; data security applies</td></tr></tbody></table></div>
<div class="grid2"><div class="card"><h3>Comments and explanations</h3><ul><li>Data point comments for specific numbers</li><li>Comment widgets for page commentary</li><li>Exported PDFs can include comments</li></ul></div>
<div class="card"><h3>Refreshing data</h3><ul><li>Live data refreshes when the story is opened or refreshed.</li><li>Import data is as fresh as the last import job.</li><li>Show a "last refreshed" note so readers trust the numbers.</li></ul></div></div>`,
say:"Filter wide or narrow, prompt once, bookmark the views people need, and deliver reports by schedule.",
act:"Add a story filter for Year, cascading input controls Country → City, a dynamic 'last 12 months' date filter, a global bookmark 'EMEA view', then export to PDF with the filter appendix and set up a weekly schedule.",
qs:[
{q:"The CFO wants the report to always show the last 12 months without editing it each month. What do you use?",o:["A dynamic date filter","A fixed date filter","A new version","Custom sorting"],r:0,a:`<p>A <b>dynamic date filter</b> (for example "last 12 months") moves with today's date.</p>`},
{q:"After choosing a country, users should only see that country's cities in the next filter. What is this?",o:["Cascading input controls","Linked analysis","Blending","Data locking"],r:0,a:`<p><b>Cascading input controls</b>: one filter limits the members shown in the next.</p>`},
{q:"A BW query asks for a fiscal year before showing data. What is this called in SAC?",o:["A variable shown in a prompt dialog","A threshold","A bookmark","A calculated dimension"],r:0,a:`<p>A <b>variable</b>, which SAC shows in a <b>prompt</b> dialog.</p>`},
{q:"Five teams need the same story, each with different default filters. Best approach?",o:["Copy the story five times","Create global bookmarks for each view","Email screenshots","Make five models"],r:1,a:`<p>Use <b>bookmarks</b> (global, or personal per user). One story, many saved views.</p>`},
{q:"Managers want the story as a PDF every Monday morning by email. What do you set up?",o:["Schedule publication","Export data to CSV","Present mode","Data point comment"],r:0,a:`<p><b>Schedule publication</b> emails the story as PDF or PowerPoint on a schedule.</p>`},
{q:"You quickly start a story from an Excel file. What does SAC create, and what is the drawback?",a:`<p>An <b>embedded dataset</b> inside the story. It's fast, but it is not reusable across stories and lacks the governance and security of a proper model.</p>`},
{q:"Name three things you can include when exporting to PDF.",a:`<p>Any three: chosen pages, paper size and orientation, an appendix with filters/prompts, comments, page numbers or header/footer details.</p>`}
]},
{m:5,d:2,t:"Scripting 1: advanced mode, script editor, events and JavaScript basics",s:"From zero to your first working scripts",
goal:"By the end, you can switch on advanced mode, find your way in the script editor and API reference, write events with variables, conditions and loops, and script buttons, dropdowns, checkboxes, input fields, popups and panels.",
body:`<p>Scripting lets a story <b>react in custom ways</b>: switch measures, show or hide panels, build your own filter logic, open other stories, run planning actions. SAC scripts look like <b>JavaScript</b>, but they run in a safe sandbox and can only use the <b>SAC API</b> (no web page DOM, no direct internet calls).</p>
<div class="say"><b>Do you even need a script?</b>First try the no-code options: input controls, linked analysis, dynamic text, bookmarks, data action trigger widgets. Use scripts when these can't do what the business needs.</div>
<h3>Step 1: advanced mode and the outline</h3>
<ol><li>Open the story in edit mode and switch on <b>Advanced Mode</b> (scripting features appear).</li><li>Open the <b>Outline</b> panel. You see every widget, plus a <b>Scripting</b> area for <b>script variables</b>, <b>script objects</b> and <b>technical objects</b> (timers, bookmark sets, export to PDF, data actions, multi actions, OData services...).</li><li>Hover a widget in the Outline (or right-click it on the canvas) and click the <b>fx / Edit Scripts</b> icon to open the <b>script editor</b> for one of its events.</li></ol>
<h3>Step 2: the script editor</h3>
<div class="grid2"><div class="card"><h3>Helpful features</h3><ul><li><b>Ctrl + Space</b>: value help and auto-complete (widget names, methods, member IDs).</li><li>Red underline = <b>error</b>; check the <b>Errors</b> list in the Info panel.</li><li>Hover a method to see its parameters and description.</li><li>Comment your code with <code>//</code>.</li><li>Rename widgets to meaningful names (Chart_Sales, Btn_Reset) <b>before</b> scripting.</li></ul></div>
<div class="card"><h3>API reference</h3><p>The <b>Optimized Story Experience API Reference</b> (on help.sap.com) lists every class (Application, DataSource, Chart, Table, Dropdown, Planning...) with its methods, parameters and return types. When you don't know how to do something, search the class there.</p></div></div>
<h3>Step 3: events (when code runs)</h3>
<div class="scroll"><table class="stack"><thead><tr><th>Widget / object</th><th>Event</th><th>Runs when</th></tr></thead><tbody>
<tr><td>Story / page</td><td>onInitialization</td><td>The story (or page) loads. Keep this short!</td></tr>
<tr><td>Button</td><td>onClick</td><td>The button is clicked</td></tr>
<tr><td>Dropdown, radio button group, checkbox group, list box</td><td>onSelect</td><td>The user selects an item</td></tr>
<tr><td>Input field, slider</td><td>onChange</td><td>The value changes</td></tr>
<tr><td>Chart, table, geo map</td><td>onSelect</td><td>The user selects a data point or cell</td></tr>
<tr><td>Chart, table</td><td>onResultChanged</td><td>The widget's data changes (after filters or refresh)</td></tr>
<tr><td>Timer</td><td>onTimeout</td><td>The timer ends</td></tr>
<tr><td>Popup</td><td>onButtonClick</td><td>A popup footer button is clicked</td></tr>
<tr><td>Story (embedded)</td><td>onPostMessageReceived</td><td>A host web page sends a message</td></tr></tbody></table></div>
<h3>Step 4: JavaScript basics you need</h3>
<pre style="min-height:0">// 1. Variables
var year = "2026";              // text (string)
var target = 1000000;           // number
var isManager = true;           // true / false (boolean)
var regions = ["EMEA", "APJ"];  // array (list)

// 2. Joining text
var title = "Revenue " + year;  // "Revenue 2026"

// 3. Conditions
if (target &gt; 500000) {
  Text_Title.applyText("Big target");
} else {
  Text_Title.applyText("Normal target");
}

// 4. Loops
for (var i = 0; i &lt; regions.length; i++) {
  console.log(regions[i]);      // prints to the browser console
}

// 5. switch for many options
switch (Dropdown_View.getSelectedKey()) {
  case "chart": Chart_1.setVisible(true);  Table_1.setVisible(false); break;
  case "table": Chart_1.setVisible(false); Table_1.setVisible(true);  break;
}</pre>
<p style="color:var(--soft)">SAC scripts are <b>typed</b>: the editor checks that you pass the right kind of value (string, number, boolean, member info, etc.). A wrong type shows an error before you run.</p>
<h3>Step 5: generic navigation widgets</h3>
<div class="scroll"><table class="stack"><thead><tr><th>Widget</th><th>Key methods</th><th>Example</th></tr></thead><tbody>
<tr><td>Any widget</td><td>setVisible(), isVisible()</td><td><code>Panel_Details.setVisible(true);</code></td></tr>
<tr><td>Button</td><td>setText(), setEnabled()</td><td><code>Btn_Run.setEnabled(false);</code></td></tr>
<tr><td>Dropdown</td><td>getSelectedKey(), getSelectedText(), setSelectedKey(), addItem(key, text), removeAllItems()</td><td><code>var k = Dropdown_Region.getSelectedKey();</code></td></tr>
<tr><td>Radio button group</td><td>getSelectedKey(), setSelectedKey()</td><td>Pick "Actual" or "Budget"</td></tr>
<tr><td>Checkbox group</td><td>getSelectedKeys() (array)</td><td>Pick several regions</td></tr>
<tr><td>Input field</td><td>getValue(), setValue()</td><td>Type a growth %</td></tr>
<tr><td>Slider</td><td>getValue()</td><td>Choose Top N (5–20)</td></tr>
<tr><td>Text</td><td>applyText()</td><td><code>Text_Title.applyText("Sales " + k);</code></td></tr>
<tr><td>Popup</td><td>open(), close()</td><td><code>Popup_Help.open();</code></td></tr>
<tr><td>Tab strip</td><td>getSelectedKey(), setSelectedKey()</td><td>Switch tabs from a button</td></tr>
<tr><td>Application</td><td>showMessage(), showBusyIndicator(), hideBusyIndicator(), getUserInfo()</td><td><code>Application.showMessage(ApplicationMessageType.Info, "Done");</code></td></tr></tbody></table></div>
<h3>Your first three scripts</h3>
<pre style="min-height:0">// Btn_Toggle - onClick: switch between chart and table
var showChart = !Chart_Sales.isVisible();
Chart_Sales.setVisible(showChart);
Table_Sales.setVisible(!showChart);

// Dropdown_View - onSelect: change the title
Text_Title.applyText("You are viewing: " + Dropdown_View.getSelectedText());

// Btn_Help - onClick: open a help popup
Popup_Help.open();</pre>`,
say:"Event + widget + method. Pick the event, find the method in the API reference, test, repeat.",
act:"Turn on Advanced Mode. Add a button that toggles a chart and table, a dropdown that changes a text title, and a popup with help text. Use Ctrl + Space for every name.",
qs:[
{q:"Where do you write code that should run when the story opens?",o:["Button onClick","onInitialization of the story/page","Chart onSelect","Timer onTimeout"],r:1,a:`<p><b>onInitialization</b>. Keep it short, because everything in it delays the first view.</p>`},
{q:"What keyboard shortcut opens value help / auto-complete in the script editor?",o:["Ctrl + S","Ctrl + Space","Alt + F4","F5"],r:1,a:`<p><b>Ctrl + Space</b> shows widget names, methods and member IDs.</p>`},
{q:"What does this do? <code>Popup_Help.open();</code>",a:`<p>It opens the popup named <b>Popup_Help</b>. Usually placed in a button's onClick event.</p>`},
{q:"Which method reads the key the user picked in a dropdown?",o:["getValue()","getSelectedKey()","getSelections()","applyText()"],r:1,a:`<p><b>getSelectedKey()</b> returns the item key; getSelectedText() returns the visible text.</p>`},
{q:"Which method changes the words in a text widget?",o:["setText()","applyText()","write()","setTitle()"],r:1,a:`<p><b>applyText()</b> sets the text of a text widget.</p>`},
{q:"Can an SAC script change any part of the browser page or call any website directly?",o:["Yes, anything","No, scripts run in a sandbox and use only the SAC API (plus allowed technical objects)"],r:1,a:`<p><b>No.</b> Scripts use the SAC API only; external calls go through approved objects like OData services.</p>`},
{q:"Fix the bug: <code>if (x &gt; 10) { Chart_1.setVisible(true) } else Chart_1.setVisible(false)</code> works, but the team says it's hard to read. What would you improve?",a:`<p>Use braces for both branches and semicolons, or simplify to <code>Chart_1.setVisible(x &gt; 10);</code>. Simple, readable code is easier to debug.</p>`},
{q:"Name four events and when they run.",a:`<p>onInitialization (story loads), onClick (button clicked), onSelect (item or data point selected), onResultChanged (widget data changes), onChange (input value changes), onTimeout (timer ends).</p>`}
]},
{m:5,d:2,t:"Scripting 2: data, filters, variables, planning and technical objects",s:"The APIs that make real business stories",
goal:"By the end, you can filter and read data with the DataSource API, switch measures and dimensions, loop through result sets, use script variables and script objects, and script bookmarks, timers, PDF export, navigation and planning.",
body:`<h3>The DataSource: your door to the data</h3>
<p>Every chart, table and geo map has a data source: <code>Chart_1.getDataSource()</code>. Most data scripting starts there.</p>
<div class="scroll"><table class="stack"><thead><tr><th>Method</th><th>What it does</th></tr></thead><tbody>
<tr><td>setDimensionFilter(dim, value)</td><td>Filter a dimension to one member or an array of members</td></tr>
<tr><td>removeDimensionFilter(dim)</td><td>Remove that filter</td></tr>
<tr><td>getDimensionFilters(dim)</td><td>Read current filters</td></tr>
<tr><td>copyDimensionFilterFrom(otherDataSource, dim)</td><td>Copy a filter from another widget's data source</td></tr>
<tr><td>getResultSet()</td><td>Read the data rows that are currently shown (fast)</td></tr>
<tr><td>getMembers(dim, options)</td><td>Read master data members of a dimension</td></tr>
<tr><td>getData(selection)</td><td>Read one value (a cell) for a selection</td></tr>
<tr><td>getVariables(), setVariableValue(var, value), openPromptDialog()</td><td>Work with prompts/variables</td></tr>
<tr><td>setHierarchy(dim, id), setHierarchyLevel(dim, level)</td><td>Change hierarchy and drill level</td></tr>
<tr><td>setRefreshPaused(true/false), refreshData()</td><td>Pause updates while you change many things, then refresh once</td></tr>
<tr><td>isResultEmpty()</td><td>Check if there is any data</td></tr></tbody></table></div>
<pre style="min-height:0">// Filter one widget
Table_Sales.getDataSource().setDimensionFilter("Region", "EMEA");

// Filter to several members
Table_Sales.getDataSource().setDimensionFilter("Region", ["EMEA", "APJ"]);

// Faster: pass a MemberInfo (id + description) so SAC needs no extra trip for the text
Table_Sales.getDataSource().setDimensionFilter("Region", {id: "EMEA", description: "Europe"});

// Same filter on two widgets
var ds = Chart_Sales.getDataSource();
Table_Sales.getDataSource().copyDimensionFilterFrom(ds, "Region");</pre>
<p style="color:var(--soft)">Member IDs must be the exact IDs. On BW/HANA live sources they often look like <code>[Region].[Hierarchy].&amp;[EMEA]</code>. Always pick them with <b>Ctrl + Space</b> value help.</p>
<h3>Using selections (click on a chart → filter a table)</h3>
<pre style="min-height:0">// Chart_Sales - onSelect
var sel = Chart_Sales.getSelections();
if (sel.length &gt; 0) {
  Table_Detail.getDataSource().setDimensionFilter("Region", sel[0]["Region"]);
} else {
  Table_Detail.getDataSource().removeDimensionFilter("Region");
}</pre>
<h3>Reading data: result sets and arrays</h3>
<pre style="min-height:0">// Loop through what the chart shows and build a text
var rs = Chart_Sales.getDataSource().getResultSet();
var lines = "";
for (var i = 0; i &lt; rs.length; i++) {
  var row = rs[i];
  lines = lines + row["Region"].description + ": "
        + row["@MeasureDimension"].formattedValue + "\\n";
}
Text_Summary.applyText(lines);

// Fill a dropdown from the data
Dropdown_Region.removeAllItems();
for (var j = 0; j &lt; rs.length; j++) {
  Dropdown_Region.addItem(rs[j]["Region"].id, rs[j]["Region"].description);
}</pre>
<p>SAP's performance guidance says <b>getResultSet()</b> is faster than <b>getMembers()</b> for reading members that are in the data, so prefer it. <b>getData()</b> is good for one KPI value without an extra chart.</p>
<h3>Switch measures and dimensions</h3>
<pre style="min-height:0">// Radio_Measure - onSelect: show Revenue or Quantity
var m = Radio_Measure.getSelectedKey();          // key = measure ID
Chart_Sales.removeMeasure(CurrentMeasure, Feed.ValueAxis);
Chart_Sales.addMeasure(m, Feed.ValueAxis);
CurrentMeasure = m;                               // a script variable remembers the current one

// Swap the dimension on the category axis
Chart_Sales.removeDimension("Region", Feed.CategoryAxis);
Chart_Sales.addDimension("Product", Feed.CategoryAxis);</pre>
<p style="color:var(--soft)">No-code alternative: a <b>measure input control</b> or <b>dimension input control</b> can switch measures and dimensions without scripting.</p>
<h3>Global scripting options</h3>
<div class="grid2"><div class="card"><h3>Script variables</h3><ul><li>Created in the Outline → Scripting. Have a <b>type</b> (string, number, boolean, member info...) and can be <b>arrays</b>.</li><li>Keep values between events (e.g. the current measure).</li><li>Can be used in calculated measures and dynamic text, so the story reacts to a variable.</li><li>Can be exposed as a <b>URL parameter</b> (<code>p_VariableName</code>) so a link opens the story preset.</li></ul></div>
<div class="card"><h3>Script objects (functions)</h3><ul><li>Reusable functions you write once and call from many events: <code>Utils.resetFilters();</code></li><li>Have parameters and return values.</li><li>Keep events short and avoid copy-paste code.</li><li><b>Pattern-based functions</b> help build some logic with a guided, no-code wizard.</li></ul></div></div>
<pre style="min-height:0">// Script object "Utils", function resetFilters()
Chart_Sales.getDataSource().removeDimensionFilter("Region");
Table_Sales.getDataSource().removeDimensionFilter("Region");
Dropdown_Region.setSelectedKey("ALL");

// Any button: Utils.resetFilters();</pre>
<h3>Technical objects</h3>
<div class="scroll"><table class="stack"><thead><tr><th>Object</th><th>Key API</th><th>Use</th></tr></thead><tbody>
<tr><td>Timer</td><td>start(seconds), stop(), isRunning(); event onTimeout</td><td>Auto-refresh, rotating KPIs, delayed actions</td></tr>
<tr><td>Export to PDF</td><td>exportView(), exportReport()</td><td>A button that exports the current view or a report; also needed for PDF in scheduled publications of scripted stories</td></tr>
<tr><td>Bookmark set</td><td>save, list and apply bookmarks</td><td>"Save my view" buttons</td></tr>
<tr><td>Data action</td><td>setParameterValue(id, value), execute(), executeInBackground()</td><td>Run planning logic from a button with user-chosen parameters</td></tr>
<tr><td>Multi action</td><td>setParameterValue(), execute()</td><td>Run a full planning process</td></tr>
<tr><td>OData service</td><td>call actions of an OData service</td><td>Write back to or read from another system</td></tr>
<tr><td>Calendar integration</td><td>read and work with calendar tasks</td><td>Approve or reject from the story</td></tr></tbody></table></div>
<pre style="min-height:0">// Btn_Export - onClick
ExportToPDF_1.exportView();

// Timer: refresh every 60 seconds
// Story onInitialization:  Timer_Refresh.start(60);
// Timer_Refresh onTimeout:
Application.refreshData();
Timer_Refresh.start(60);</pre>
<h3>Navigation and URLs</h3>
<pre style="min-height:0">// Open another story in a new tab, passing a script variable
NavigationUtils.openStory("STORY_ID", "", UrlParameter.create("p_Region", "EMEA"), true);

// Open any web address
NavigationUtils.openUrl("https://www.sap.com", true);</pre>
<p>The <b>SAP Analytics Cloud URL API</b> also lets you open a story with filters and mode set in the link. Don't call openStory in onInitialization; SAP notes this can break, so run it from a user action.</p>
<h3>Planning scripts</h3>
<pre style="min-height:0">// Publish the Forecast version from a button
Table_Plan.getPlanning().getPublicVersion("Forecast").publish();

// Run a data action with the year the user picked
DataAction_Copy.setParameterValue("TargetYear", Dropdown_Year.getSelectedKey());
Application.showBusyIndicator();
DataAction_Copy.execute();
Application.hideBusyIndicator();
Application.showMessage(ApplicationMessageType.Success, "Copy finished");</pre>
<p>Other planning APIs: get public or private versions, <b>publishAs</b>, <b>revert</b>, write a value with <b>setUserInput()</b> then <b>submitData()</b>, and read <b>data locking</b> states. Background execution of data actions has rate limits (SAP notes about 20 calls per 60 seconds), so don't call it in a tight loop.</p>
<h3>More: CSS, R, postMessage, mobile</h3>
<div class="grid2"><div class="card"><h3>CSS in stories</h3><p>Define CSS classes (in the story's CSS editor) and apply them with <code>setCssClass()</code> on widgets, or set a global class. For consistent custom styling beyond themes.</p></div>
<div class="card"><h3>R visualization</h3><p>Write R code for special charts; scripts can pass values into the R widget through its input parameters.</p></div>
<div class="card"><h3>postMessage</h3><p>When a story is embedded in another web page, <code>Application.postMessage()</code> and the <b>onPostMessageReceived</b> event let them exchange messages.</p></div>
<div class="card"><h3>Mobile</h3><p>Check <code>Application.isMobile()</code> (where available) to show a simpler layout on phones, and keep scripts light.</p></div></div>`,
say:"getDataSource, filter, read, switch, then reuse with script variables and script objects.",
act:"Build: (1) chart onSelect filters a table; (2) a dropdown filled from getResultSet(); (3) a radio group that switches the measure; (4) a 'Reset' button using a script object; (5) an Export PDF button.",
qs:[
{q:"Which line filters a table to EMEA and APJ?",o:["Table_1.setFilter(\"EMEA, APJ\")","Table_1.getDataSource().setDimensionFilter(\"Region\", [\"EMEA\", \"APJ\"])","Table_1.filter = EMEA","Table_1.getDataSource().getMembers(\"EMEA\")"],r:1,a:`<p>Use <b>getDataSource().setDimensionFilter()</b> with an <b>array</b> for several members.</p>`},
{q:"To read members that appear in a chart's data, which API does SAP recommend for performance?",o:["getMembers()","getResultSet()","Both are always the same","applyText()"],r:1,a:`<p>SAP's performance guidance: <b>getResultSet()</b> is faster than getMembers() for this.</p>`},
{q:"What does <code>Chart_1.getSelections()</code> return?",a:`<p>An <b>array</b> of the data points the user selected. Each item tells you the member IDs per dimension, for example <code>sel[0]["Region"]</code>.</p>`},
{q:"You need the same 'reset all filters' code on 6 buttons. Best practice?",o:["Copy the code 6 times","Write it once in a script object function and call it","Use a timer","Use a theme"],r:1,a:`<p>A <b>script object</b> function: one place to maintain, called from every button.</p>`},
{q:"A link should open the story already filtered to India. What do you use?",o:["A script variable exposed as a URL parameter (p_...)","A data lock","A pie chart","A private version"],r:0,a:`<p>Expose a <b>script variable as a URL parameter</b> (for example <code>p_Country=IN</code>) and use it in onInitialization to set the filter. The SAC URL API can also pass filters.</p>`},
{q:"Which object lets a button export the current view to PDF?",o:["Timer","Export to PDF technical object (exportView())","Bookmark set","Data action"],r:1,a:`<p>The <b>Export to PDF</b> technical object, for example <code>ExportToPDF_1.exportView();</code></p>`},
{q:"What does this do? <code>Table_Plan.getPlanning().getPublicVersion(\"Forecast\").publish();</code>",a:`<p>It <b>publishes</b> the user's changes to the public <b>Forecast</b> version.</p>`},
{q:"Why use setRefreshPaused(true) before setting several filters?",a:`<p>So the widget doesn't reload after each change. Set all filters, then setRefreshPaused(false) (or refresh once). Fewer backend calls = faster story.</p>`},
{q:"Which line runs a data action after setting a parameter?",o:["DataAction_1.run()","DataAction_1.setParameterValue(\"Year\",\"2027\"); DataAction_1.execute();","Application.execute(DataAction_1)","DataAction_1.publish()"],r:1,a:`<p>Set parameters with <b>setParameterValue()</b>, then call <b>execute()</b>.</p>`}
]},
{m:5,d:3,t:"Scripting 3: debugging, performance and extensibility",s:"Find bugs fast and keep scripted stories quick",
goal:"By the end, you can debug scripts with the browser tools and debug mode, read common errors, speed up scripted stories with SAP's best practices, and know the options for reuse and extension.",
body:`<h3>Debugging toolkit</h3>
<div class="grid2"><div class="card"><h3>1. Errors before running</h3><p>The script editor underlines errors in red. The <b>Info panel → Errors</b> lists all script errors and warnings in the story. Fix these first.</p></div>
<div class="card"><h3>2. console.log</h3><p>Print values while the story runs: <code>console.log("Selected: " + key);</code>. Open the browser developer tools (<b>F12</b>) → <b>Console</b> tab to see them. Filter for Info entries.</p></div>
<div class="card"><h3>3. Breakpoints in DevTools</h3><p>Run the story, press F12 → <b>Sources</b>. Your scripts appear under an entry starting with <b>sandbox.worker.main</b> once they have run at least once. Press <b>Ctrl + P</b> and type the script name (e.g. <code>Button_1.onClick</code>), then click a line number to pause there.</p></div>
<div class="card"><h3>4. Debug mode + debugger;</h3><p>Add <b>debug=true</b> to the story's runtime URL. Then a <code>debugger;</code> statement in your script pauses execution automatically, and your comments are kept. In debug mode, script files get the suffix <b>-dbg</b> (e.g. <code>Button_1.onClick-dbg.js</code>).</p></div></div>
<pre style="min-height:0">// Example: find out why a filter doesn't work
var key = Dropdown_Region.getSelectedKey();
console.log("Dropdown key = " + key);      // is it "EMEA" or "[Region].&amp;[EMEA]"?
debugger;                                  // pauses here in debug mode
Table_1.getDataSource().setDimensionFilter("Region", key);</pre>
<h3>Common errors and fixes</h3>
<div class="scroll"><table class="stack"><thead><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr></thead><tbody>
<tr><td>Filter does nothing, no error</td><td>Wrong member ID format, or dimension not in the widget's model; some dimensions (like a secondary structure) can't be filtered by script</td><td>Log the key, use value help for the real ID, check the API notes</td></tr>
<tr><td>"Cannot read property of undefined"</td><td>Empty selection or empty result set</td><td>Check <code>sel.length &gt; 0</code> or <code>isResultEmpty()</code> first</td></tr>
<tr><td>Script works in edit, fails for viewers</td><td>Viewer lacks rights to data or to run data actions</td><td>Check roles and data access</td></tr>
<tr><td>Navigation in onInitialization breaks</td><td>Opening another story destroys the running script context</td><td>Run navigation from a user action or later</td></tr>
<tr><td>Wrong type error</td><td>Passing a number where a string is expected</td><td>Convert: <code>"" + n</code> or use the right type</td></tr>
<tr><td>Name not found</td><td>Widget was renamed or deleted</td><td>Update the script; use the Outline names</td></tr></tbody></table></div>
<h3>Why are scripted stories slow? Know the architecture</h3>
<p>The story runs in the <b>browser</b>. Each data request goes to the <b>backend</b> (SAC for import models, or the live source system). Time is spent in: <b>backend</b> (queries), <b>network</b> (round trips) and <b>frontend</b> (rendering and scripts, which depends on the user's computer). Fewer and smaller requests = faster.</p>
<h3>Performance best practices (from SAP's performance course)</h3>
<div class="grid2"><div class="card"><h3>Startup</h3><ul><li>Keep <b>onInitialization</b> short; set defaults in the designer instead of by script where possible.</li><li>Use <b>pause refresh</b> while setting many filters or variables, then refresh once.</li><li>Use <b>load invisible widgets in background</b> so hidden widgets don't slow the first view.</li><li>Split huge stories into several stories or pages and navigate between them.</li></ul></div>
<div class="card"><h3>Scripts</h3><ul><li>Prefer <b>getResultSet()</b> over getMembers() to read members in the data.</li><li>Pass <b>MemberInfo</b> (id + description) to setDimensionFilter to avoid extra trips.</li><li>Use <b>getData()</b> for single KPI values instead of extra hidden charts.</li><li>Don't put backend calls inside loops; read once, then loop over the result.</li><li>Store repeated objects in a variable (<code>var ds = Chart_1.getDataSource();</code>).</li><li>Set several variables together, then refresh once.</li></ul></div></div>
<div class="grid2"><div class="card"><h3>Tools to measure</h3><ul><li><b>Performance Analysis Tool</b> / performance insights for stories</li><li>Browser DevTools: Network and Performance tabs</li><li>The <b>script performance popup</b> (see SAP Help: "View Script Performance in a Popup") shows how long each script took</li></ul></div>
<div class="card"><h3>Design rules</h3><ul><li>One purpose per page, few widgets</li><li>Filters early, Top N</li><li>Move common calculations to the model</li><li>Test as a normal viewer on a normal laptop and on mobile</li></ul></div></div>
<h3>Reuse and extensibility</h3>
<div class="scroll"><table class="stack"><thead><tr><th>Option</th><th>Needs web development?</th><th>What it gives you</th></tr></thead><tbody>
<tr><td>Templates, themes, CSS classes</td><td>No</td><td>Same look everywhere</td></tr>
<tr><td>Script objects, pattern-based functions</td><td>No (just SAC scripting)</td><td>Reusable logic</td></tr>
<tr><td>Composites (reusable widget groups, where available)</td><td>No</td><td>Build once, reuse in many stories</td></tr>

const EXTRA_START={m:1,d:0,t:"Getting started extras: My Metrics, live models, Office add-ins and viewing stories",s:"Small topics from the beginner course that often get missed",
goal:"By the end, you can build a My Metrics list, create a live model step by step, explain the Microsoft Office add-ins, and use a story as a viewer.",
body:`<p>These topics come from SAP's beginner course (SACE11, "Exploring SAP Analytics Cloud"). They are small, but they are part of the official learning journey.</p>
<h3>My Metrics: your personal KPI list</h3>
<div class="grid2"><div class="card"><h3>What it is</h3><ul><li>A personal list of the business numbers (metrics) that matter most to you.</li><li>Create one from a chart in a story: right-click → <b>Add to Metrics List</b>, then pick an existing list or create a new one. You can change the description and filters.</li><li>Open it from <b>My Metrics</b> in the side navigation (it can also show on Home).</li><li>Each metric shows as a <b>card</b>. Click a card to see its chart and insights.</li></ul></div>
<div class="card"><h3>Working with metrics</h3><ul><li><b>Reload</b> the list to get the latest values.</li><li><b>Share</b> a whole list, or single metrics, with View, Edit or Full Control.</li><li>Use <b>Smart Insights</b> on a metric to see what drives it.</li><li>A metric is a <b>copy at the time you create it</b>: later changes to the calculation in the story are not carried over.</li><li>Missing menu? Your role needs the <b>Metrics List</b> privilege (ask an admin).</li></ul></div></div>
<h3>Creating a live model (step by step)</h3>
<ol><li>Side navigation → <b>Modeler</b>.</li><li>On the Modeler start page choose <b>Live Data Model</b>.</li><li>In <b>Create Model from Live Data Connection</b>, pick the <b>System Type</b> (for example SAP HANA, SAP BW, SAP S/4HANA, SAP BusinessObjects), the <b>Connection</b> and the <b>Data Source</b> (for example a HANA calculation view, a BW query or an S/4HANA CDS view).</li><li>Check the measures and dimensions (for example pick the order date as the time dimension).</li><li>Save the model, then use it in a story or the Data Analyzer.</li></ol>
<p>The <b>connection</b> is usually created by the SAC administrator; the <b>data source</b> (view or query) is built by the source system team. With a live model, no data is stored in SAC.</p>
<h3>Microsoft Office add-ins</h3>
<div class="scroll"><table class="stack"><thead><tr><th>Add-in</th><th>What it does</th></tr></thead><tbody>
<tr><td>SAP Analytics Cloud, add-in for Microsoft Excel</td><td>Bring SAC model data into Excel, analyse, format and enrich it with Excel functions, and <b>plan</b> (enter data, run data actions) from Excel. This is where SAP puts future SAC-Excel development.</td></tr>
<tr><td>SAP Analysis for Microsoft Office, edition for SAP Analytics Cloud</td><td>The classic Analysis for Office add-in for multidimensional analysis of SAP sources, including SAC. Can also plan on SAC data, but new development goes into the Excel add-in above.</td></tr>
<tr><td>SAP Analytics Cloud, add-in for Microsoft PowerPoint</td><td>Insert charts and other widgets from SAC stories into PowerPoint slides and refresh them with the latest data. Needs an SAC licence.</td></tr></tbody></table></div>
<p>All add-ins are installed from the Microsoft Office store (AppSource).</p>
<h3>Viewing and interacting with a story (viewer skills)</h3>
<div class="grid2"><div class="card"><h3>What a viewer can do</h3><ul><li>Open from Home, Files or the Catalog</li><li>Use input controls and the filter bar</li><li>Click data points (linked analysis), drill up and down</li><li>Sort, show Top N, open the <b>Explorer</b></li><li>Read and add comments, use bookmarks</li><li>Use <b>Present</b> mode, export, or open on mobile</li></ul></div>
<div class="card"><h3>Compass or time-series prediction?</h3><ul><li><b>Time-series forecast</b>: continues past trends into the future. "What happens if things go on like this?"</li><li><b>Compass</b>: Monte Carlo "what if" with ranges for uncertain drivers. "How likely is our target if costs move?"</li><li>You can combine them: forecast first, then simulate risk on top.</li></ul></div></div>`,

{q:"A user can't see My Metrics in the menu. Likely fix?",o:["Reinstall the browser","An admin adds the Metrics List privilege to their role","Create a new model","Use dark mode"],r:1,a:`<p>The role needs the <b>Metrics List</b> privilege.</p>`},

{q:"Finance wants to plan in Excel on SAC models, using SAP's future direction. Which add-in?",o:["SAP Analytics Cloud, add-in for Microsoft Excel","No add-in exists","Only PowerPoint add-in","A geo map"],r:0,a:`<p>The <b>SAP Analytics Cloud, add-in for Microsoft Excel</b>. SAP says future SAC-Excel development goes there.</p>`},
