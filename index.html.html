<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAC Data Analyst Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;800&display=swap">
<style>
/* VOICE professional course site, calm and clear, easy English, ready to record on video
   IDEA a metro map: the course is a train line, modules are coloured lines, lessons are stations
   PICTURE the course map on the home page; inside lessons, the question cards that pop open are the star
   COLOUR white ground, near-black ink, module colours red / blue / amber / green, blue for actions
   TYPE Figtree 800 titles, Figtree 400/500 text
   LAYOUT top bar + left lesson rail on desktop; on phone the rail becomes a scrolling row; presenter mode hides the rail and enlarges text */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0e1116);--ink:light-dark(#101318,#eef1f5);--soft:light-dark(#566070,#a6aebb);--panel:light-dark(#f4f6f9,#161b23);--edge:light-dark(#dfe4ea,#29303b);--blue:light-dark(#0a5cff,#5b93ff);--red:#e6261f;--bl:#0a5cff;--amber:#e8a200;--green:#00a05a;--ok:light-dark(#00874c,#3fd18c);--okbg:light-dark(#e5f7ee,#0f2a1e);--bad:light-dark(#c81e1e,#ff7b7b);--badbg:light-dark(#fdeaea,#2c1414)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Figtree,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-weight:800;line-height:1.1;letter-spacing:-.02em;text-wrap:balance;margin:0 0 .45em}
h1{font-size:clamp(34px,4.6vw,52px)}
h2{font-size:clamp(26px,3vw,34px);margin-top:1.4em}
h3{font-size:20px}
p{margin:0 0 .85em;max-width:72ch}
a{color:var(--blue)}
ul{padding-left:1.2em;margin:.3em 0 .9em}
li{margin:.3em 0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px max(3vw,16px);background:var(--bg);border-bottom:1px solid var(--edge)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;text-decoration:none;color:var(--ink);margin-right:auto}
.logo{width:34px;height:34px;flex:none}
.btn{min-height:44px;padding:9px 13px;font-size:15px;border-radius:10px;border:1px solid var(--edge);background:var(--panel);font-weight:700}
.btn.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn[aria-pressed=true]{background:var(--blue);color:#fff;border-color:var(--blue)}
.bar{height:6px;background:var(--panel);flex-basis:100%;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);width:0;transition:width .5s}
/* shell */
.shell{display:grid;grid-template-columns:290px minmax(0,1fr);max-width:1320px;margin:0 auto}
.rail{border-right:1px solid var(--edge);padding:18px 14px;position:sticky;top:var(--hh,140px);align-self:start;max-height:calc(100vh - var(--hh,140px));overflow:auto}
.rail h4{margin:16px 10px 6px;font-size:14px;color:var(--soft);font-weight:700}
.rail a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:500;min-height:44px;line-height:1.25}
.rail a:hover{background:var(--panel)}
.rail a.on{background:var(--panel);font-weight:800}
.num{flex:none;width:28px;height:28px;border-radius:50%;border:4px solid var(--c,var(--soft));display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--bg)}
.rail a.done .num{background:var(--c);color:#fff}
main{padding:clamp(22px,3.5vw,48px) max(4vw,16px) 80px}
.page{max-width:900px}
@media(max-width:900px){.shell{grid-template-columns:1fr}.rail{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--edge);display:flex;overflow-x:auto;gap:4px;padding:8px 12px}.rail h4{display:none}.rail a{flex:none}}
/* presenter mode */
body.present{font-size:21px}
body.present .shell{grid-template-columns:1fr}
body.present .rail{display:none}
body.present .page{max-width:1100px;margin:0 auto}
body.present h1{font-size:clamp(40px,5.4vw,64px)}
body.present .qhead{font-size:24px}
body.present .hint{display:block}
.hint{display:none;color:var(--soft);font-size:15px;margin-bottom:18px}
/* home map */
.map{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin:26px 0 10px}
@media(max-width:820px){.map{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.map{grid-template-columns:1fr}}
.line{position:relative;padding:16px 16px 10px 54px;background:var(--panel);border-radius:16px;border:1px solid var(--edge)}
.line::before{content:"";position:absolute;left:24px;top:58px;bottom:28px;width:10px;border-radius:5px;background:var(--c)}
.line h3{margin:0 0 12px -38px;display:flex;gap:10px;align-items:center;font-size:18px}
.line h3 .num{width:32px;height:32px;background:var(--c);color:#fff;border-color:var(--c)}
.stop{display:block;position:relative;text-decoration:none;color:var(--ink);padding:8px 0 14px;font-weight:700;line-height:1.25}
.stop::before{content:"";position:absolute;left:-38px;top:8px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:5px solid var(--c)}
.stop.done::before{background:var(--c)}
.stop small{display:block;font-weight:400;color:var(--soft);font-size:14px;margin-top:2px}
.stop:hover{color:var(--blue)}
/* content blocks */
.tag{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--soft);margin-bottom:10px}
.tag .dot{width:12px;height:12px;border-radius:50%;background:var(--c)}
.goal{font-size:19px;color:var(--soft);border-left:6px solid var(--c);padding-left:16px;margin:6px 0 24px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:12px 0 18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:12px 0 18px}
@media(max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:16px 18px}
.card h3{margin-bottom:6px}
.card p:last-child,.card ul:last-child{margin-bottom:0}
.say{background:color-mix(in srgb,var(--amber) 18%,var(--bg));border-radius:14px;padding:14px 18px;margin:18px 0;font-weight:500}
.say b{display:block;margin-bottom:2px}
.act{border:2px dashed var(--edge);border-radius:14px;padding:14px 18px;margin:18px 0}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;margin:8px 0 18px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--edge);vertical-align:top}
th{font-size:15px;color:var(--soft)}
td:first-child{font-weight:800}
@media(max-width:600px){table{font-size:15px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--edge)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:7.5em}.stack td::before{content:attr(data-l);float:inline-start;width:7em;margin-inline-start:-7.5em;color:var(--soft);font-weight:700}}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media(max-width:720px){.cmp{grid-template-columns:1fr}}
.bad{border-top:8px solid var(--bad)}.good{border-top:8px solid var(--ok)}
/* Q&A */
.qtools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0 16px}
.qa{border:1px solid var(--edge);border-radius:16px;margin:0 0 14px;background:var(--bg);transition:border-color .3s,box-shadow .3s}
.qa.open{border-color:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 18%,transparent)}
.qhead{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:16px 18px;font-weight:700;font-size:19px;line-height:1.35;min-height:56px}
.qn{flex:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:2px 9px;font-size:15px;margin-top:2px}
.qtext{flex:1}
.qtext small{display:block;font-weight:500;color:var(--blue);font-size:14px;margin-top:4px}
.chev{flex:none;width:30px;height:30px;border-radius:50%;background:var(--panel);display:grid;place-items:center;transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.chev::before{content:"";width:9px;height:9px;border-right:3px solid currentColor;border-bottom:3px solid currentColor;transform:translateY(-2px) rotate(45deg)}
.qa.open .chev{transform:rotate(180deg);background:var(--okbg);color:var(--ok)}
.opts{display:grid;gap:8px;padding:0 18px 14px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;padding:11px 14px;border-radius:10px;border:1px solid var(--edge);background:var(--panel);min-height:44px;transition:background .3s,border-color .3s,transform .2s}
.opt:hover{transform:translateX(3px)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--edge);display:grid;place-items:center;font-weight:800;font-size:13px}
.qa.open .opt{cursor:default;transform:none}
.qa.open .opt.right{background:var(--okbg);border-color:var(--ok);animation:glow .9s ease}
.qa.open .opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.qbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s cubic-bezier(.2,.8,.2,1)}
.qa.open .qbody{grid-template-rows:1fr}
.qinner{overflow:hidden}
.answer{margin:0 18px 18px;padding:16px 18px;border-radius:12px;background:var(--okbg);border-left:6px solid var(--ok);opacity:0;transform:translateY(-14px) scale(.96);transform-origin:top left;transition:opacity .35s .12s,transform .55s .12s cubic-bezier(.34,1.56,.64,1)}
.qa.open .answer{opacity:1;transform:none}
.answer .lbl{display:inline-block;font-weight:800;color:var(--ok);margin-bottom:4px}
.answer .you{font-weight:700;margin-bottom:6px}
.answer p:last-child,.answer ul:last-child{margin-bottom:0}
@keyframes glow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
@media(prefers-reduced-motion:reduce){.qbody,.answer,.chev,.opt,.bar i{transition:none}.qa.open .opt.right{animation:none}}
.score{font-size:24px;font-weight:800}
.nav2{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:34px;padding-top:20px;border-top:1px solid var(--edge)}
.nav2 a{text-decoration:none;font-weight:800;padding:12px 18px;border-radius:12px;background:var(--panel);border:1px solid var(--edge);color:var(--ink);min-height:44px}
.nav2 a.next{background:var(--ink);color:var(--bg)}
.check{display:flex;gap:10px;align-items:center;font-weight:700;min-height:44px;cursor:pointer;margin-top:18px}
.check input{width:22px;height:22px;accent-color:var(--green)}
label.f{display:block;font-weight:700;margin:10px 0 4px}
input[type=text],select,textarea{width:100%;font:16px/1.4 Figtree,system-ui,sans-serif;padding:11px 12px;border:1px solid var(--edge);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{min-height:64px;resize:vertical}
pre{white-space:pre-wrap;background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:14px;font:15px/1.55 ui-monospace,Menlo,monospace;margin:0;min-height:200px}
.kbd{display:inline-block;border:1px solid var(--edge);border-bottom-width:3px;border-radius:6px;padding:0 7px;font-size:14px;font-weight:700;background:var(--panel)}
code{overflow-wrap:anywhere;word-break:break-word}
.lib .pr,.answer .lbl,.opt,.qtext{overflow-wrap:anywhere}
pre{overflow-x:auto}
footer{color:var(--soft);font-size:15px;margin-top:40px}
.tabs{flex-basis:100%;display:flex;gap:6px;overflow-x:auto;padding:2px 0}
.tabs a{flex:none;text-decoration:none;color:var(--ink);font-weight:700;padding:9px 14px;border-radius:999px;border:1px solid var(--edge);min-height:44px;display:flex;align-items:center;gap:8px;background:var(--bg)}
.tabs a:hover{background:var(--panel)}
.tabs a.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs a .wd{width:10px;height:10px;border-radius:50%;background:var(--c,var(--soft))}
.rail a.sub{padding:6px 10px 6px 48px;min-height:38px;font-size:15px;color:var(--soft)}
.rail a.sub.done{color:var(--ok)}
.rail a.sub.done::after{content:" ✓";font-weight:800}
.lesson{border-top:1px solid var(--edge);padding-top:34px;margin-top:40px}
.lesson h2.lt{font-size:clamp(28px,3.4vw,40px);margin-top:.2em}
.weekhead{background:var(--panel);border:1px solid var(--edge);border-left:10px solid var(--c);border-radius:14px;padding:16px 20px;margin:8px 0 6px}
.weekhead ul{margin:.3em 0 0}
.allweek{margin-top:60px;padding-top:10px;border-top:6px solid var(--c)}
@media(max-width:900px){.rail{display:none!important}}
.demo{border-left:8px solid var(--blue);margin:0 0 14px}
.demo h3{margin-bottom:8px}
.dstep{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:start;margin:8px 0}
.dstep .dl{grid-column:1/-1;font-weight:800;font-size:14px;color:var(--blue)}
.dstep .pr{white-space:pre-wrap;background:var(--bg);border:1px solid var(--edge);border-radius:10px;padding:10px 12px;margin:0;font-size:16px}
.dstep .cmsg{grid-column:1/-1;color:var(--soft);font-size:14px}
.demo .ex{margin:6px 0 0;font-size:16px}
.demohead{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
@media(max-width:520px){.dstep{grid-template-columns:1fr}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
input[type=search]{font:16px Figtree,system-ui,sans-serif;padding:9px 12px;border:1px solid var(--edge);border-radius:10px;background:var(--bg);color:var(--ink)}
.keyc{border-left:8px solid var(--c);margin:20px 0}
.keyc h3{margin-bottom:4px}
.spot{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,#000 55%,transparent);display:grid;place-items:center;padding:16px}
.spot[hidden]{display:none}
.spotbox{background:var(--bg);border-radius:20px;padding:22px;width:min(860px,100%);max-height:92vh;overflow:auto;animation:popin .45s cubic-bezier(.34,1.56,.64,1)}
.spotbox .qhead{font-size:clamp(22px,2.8vw,30px)}
.spotbox .opt{font-size:19px}
@keyframes popin{from{opacity:0;transform:scale(.9) translateY(20px)}to{opacity:1;transform:none}}
.count{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--amber);color:#111;font-weight:800;animation:tick 1s ease infinite}
@keyframes tick{0%{transform:scale(1.25)}100%{transform:scale(1)}}
.lib{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(max-width:720px){.lib{grid-template-columns:1fr}}
.libc{display:flex;flex-direction:column;gap:8px}
.libc p.pr{background:var(--bg);border:1px solid var(--edge);border-radius:10px;padding:10px 12px;margin:0;font-size:16px;flex:1}
.libc .cat{font-size:14px;font-weight:700;color:var(--c)}
.sr{display:block;padding:12px 14px;border:1px solid var(--edge);border-radius:12px;margin:0 0 8px;text-decoration:none;color:var(--ink)}
.sr:hover{background:var(--panel)}
.sr small{display:block;color:var(--soft)}
.cert{position:relative;border:14px solid var(--ink);outline:3px solid var(--amber);outline-offset:-26px;padding:clamp(28px,5vw,60px);text-align:center;background:var(--bg);margin:20px 0}
.cert .ct{font-size:clamp(28px,4vw,44px);font-weight:800;letter-spacing:-.02em}
.cert .nm{font-size:clamp(30px,5vw,54px);font-weight:800;border-bottom:3px solid var(--amber);display:inline-block;padding:0 20px 6px;margin:14px 0;min-width:60%}
.cert .sig{display:flex;justify-content:space-around;gap:20px;flex-wrap:wrap;margin-top:34px}
.cert .sig div{border-top:2px solid var(--ink);padding-top:6px;min-width:180px;color:var(--soft)}
.cert .badge{width:70px;height:70px;margin:0 auto 10px}
@media print{body.printcert *{visibility:hidden}body.printcert #certbox,body.printcert #certbox *{visibility:visible}body.printcert #certbox{position:absolute;left:0;top:0;width:100%;margin:0}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#home"><svg class="logo" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="none" stroke="#e6261f" stroke-width="4"/><path d="M8 17h18" stroke="#0a5cff" stroke-width="4" stroke-linecap="round"/><circle cx="17" cy="17" r="4.5" fill="#00a05a"/></svg>SAC Data Analyst · C_SAC</a>
  <input type="search" id="q" placeholder="Search lessons…" aria-label="Search lessons and questions" style="width:min(190px,100%);min-height:44px">
  <button class="btn" id="b-rand" type="button">Random question</button>
  <button class="btn" id="b-think" type="button" aria-pressed="false">Think timer: off</button>
  <button class="btn" id="b-all" type="button">Show all answers</button>
  <button class="btn" id="b-present" type="button" aria-pressed="false">Presenter mode</button>
  <nav class="tabs" id="tabs" aria-label="Weeks"></nav>
  <div class="bar" aria-hidden="true"><i id="prog"></i></div>
</header>
<div class="shell">
  <nav class="rail" id="rail" aria-label="Lessons"></nav>
  <main><div class="page" id="view"></div></main>
</div>
<div class="spot" id="spot" hidden role="dialog" aria-modal="true" aria-label="Random question">
  <div class="spotbox">
    <div class="row" style="justify-content:space-between;margin:0 0 10px"><b id="spotsrc" style="color:var(--soft)"></b><button class="btn" type="button" id="spot-x">Close ✕</button></div>
    <div id="spotq"></div>
    <div class="row"><button class="btn main" type="button" id="spot-next">Another question →</button><span style="color:var(--soft);font-size:15px">Tip: press <span class="kbd">R</span> for a new one, <span class="kbd">Esc</span> to close</span></div>
  </div>
</div>

<script>
{
const C={1:"var(--red)",2:"var(--bl)",3:"var(--amber)",4:"var(--green)",5:"#0e9aa7"};
const MODS={1:"Start and connect",2:"Reporting",5:"Scripting",3:"Plan",4:"Smart features and pass"};
const DOMAINS=["Navigating & Getting Started","Data Sources, Connections & Modeling","Story Design & Data Visualization","Analyzing & Manipulating Data in Stories","Manual Planning","Advanced Planning Features","Augmented Analytics & Collaboration"];
/* q: question, a: answer html, o: options, r: right option index */
const LESSONS=[
{m:1,d:0,t:"Getting started in SAP Analytics Cloud",s:"What SAC is, where it sits, and how to move around",
goal:"By the end, you can explain what SAP Analytics Cloud does, where it fits in SAP Business Data Cloud, and find, save and share any file in the tenant.",
body:`<p><b>SAP Analytics Cloud (SAC)</b> is SAP's cloud tool for three jobs in one place: <b>business intelligence</b> (reports and dashboards), <b>planning</b> (budgets and forecasts) and <b>augmented analytics</b> (AI and machine learning help). You use it in a web browser. Nothing to install.</p>
<div class="grid3"><div class="card"><h3>1. Analyse (BI)</h3><p>Build <b>stories</b>: pages with charts, tables and maps. Explore data with the <b>Data Analyzer</b>. Share results with your team.</p></div>
<div class="card"><h3>2. Plan</h3><p>Enter budgets, forecasts and targets right in tables. Copy, allocate and convert data with <b>data actions</b>. Run a planning process with the <b>calendar</b>.</p></div>
<div class="card"><h3>3. Predict and ask</h3><p>Ask questions in plain words (<b>Just Ask</b>, <b>Joule</b>). Let SAC explain numbers (<b>Smart Insights</b>). Build forecasts and predictions (<b>Smart Predict</b>).</p></div></div>
<h3>Where SAC sits: SAP Business Data Cloud</h3>
<p><b>SAP Business Data Cloud (BDC)</b> is SAP's data platform. It brings together several tools, and SAC is the part people <b>look at and plan in</b>.</p>
<div class="scroll"><table class="stack"><thead><tr><th>Part of BDC</th><th>Simple job</th></tr></thead><tbody>
<tr><td>SAP Datasphere</td><td>Collects, joins and models business data from many systems (the "data layer")</td></tr>
<tr><td>SAP Business Warehouse (BW)</td><td>The classic SAP data warehouse many companies still use</td></tr>
<tr><td>SAP Databricks</td><td>Data science, machine learning and big data work</td></tr>
<tr><td>Data products and insight apps</td><td>Ready business data and ready dashboards from SAP</td></tr>
<tr><td>SAP Analytics Cloud</td><td>Stories, dashboards, planning and AI-assisted analysis on top of all of this</td></tr></tbody></table></div>
<p><b>Seamless planning</b> is a good example of this teamwork: the planning model is built in SAC, but the plan data is stored in SAP Datasphere, so other tools can use it straight away.</p>
<h3>The main menu (side navigation)</h3>
<div class="scroll"><table class="stack"><thead><tr><th>Area</th><th>What you do there</th></tr></thead><tbody>
<tr><td>Home</td><td>Your start page: recent files, favourites, featured content, and key numbers you pinned</td></tr>
<tr><td>Files</td><td>All stories, models, datasets and folders. Main folders: <b>My Files</b>, <b>Public</b>, <b>Workspaces</b> and <b>Shared with Me</b></td></tr>
<tr><td>Catalog</td><td>A clean "shop window" of trusted, approved content that admins have published</td></tr>
<tr><td>Stories</td><td>Create and open stories (dashboards and reports)</td></tr>
<tr><td>Data Analyzer</td><td>Quick, ad-hoc table analysis without building a story</td></tr>
<tr><td>Modeler</td><td>Create and edit models and datasets</td></tr>
<tr><td>Connections</td><td>Links to source systems (admins or modelers usually set these up)</td></tr>
<tr><td>Calendar</td><td>Planning processes, tasks, reviews and deadlines</td></tr>
<tr><td>Predictive / Smart Predict</td><td>Build predictive scenarios (classification, regression, time series)</td></tr>
<tr><td>Content Network</td><td>Import business content packages from SAP and partners, or move content between tenants</td></tr>
<tr><td>Security and System</td><td>Users, teams, roles, and system settings (admins only)</td></tr></tbody></table></div>
<div class="grid2"><div class="card"><h3>File management</h3><ul><li><b>My Files</b> is private to you until you share.</li><li><b>Public</b> folders are for content many people use.</li><li><b>Workspaces</b> keep content for one team or business area, with their own admins.</li><li>Use clear names, folders and descriptions so others can find things.</li><li>Mark files as <b>favourites</b> to see them on Home.</li></ul></div>
<div class="card"><h3>Sharing and access</h3><ul><li>Share a file with <b>users</b> or <b>teams</b>.</li><li>Pick the access level: <b>View</b>, <b>Edit</b> or <b>Full Control</b>, or set custom rights.</li><li>Sharing a story does <b>not</b> give access to data the person isn't allowed to see. Data access comes from roles and model security.</li><li>Roles (like Viewer, BI Content Creator, Planner Reporter, Admin) control which <b>features</b> a user can use.</li></ul></div>
<div class="card"><h3>Working with metrics (key numbers)</h3><p>A <b>metric</b> or KPI is one important number, like Revenue or Margin %. You can show it as a <b>numeric point</b> tile, add a <b>threshold</b> (green, amber, red), and pin it so you can watch it. Good metrics have a clear name, a time period and a target.</p></div>
<div class="card"><h3>Live or acquired data?</h3><p>SAC can read data <b>live</b> from a source (the data stays there) or <b>import</b> a copy (acquired data). You will learn this fully in Lesson 2. For now: live = always fresh and stays in the source; import = more SAC features, including planning.</p></div></div>
<div class="say"><b>Easy memory trick</b>SAC = <b>See</b> (stories), <b>Adjust</b> (planning), <b>Consult AI</b> (smart features).</div>`,
say:"SAC is one cloud tool to analyse, plan and predict. It is the 'front door' of SAP Business Data Cloud.",
act:"Open SAC (a free trial works). Visit Home, Files, Catalog and the Modeler. Create a folder in My Files and share it with one person as View only.",
qs:[
{q:"What are the three main jobs of SAP Analytics Cloud?",a:`<p><b>Business intelligence</b> (stories and analysis), <b>planning</b> (budgets and forecasts) and <b>augmented analytics</b> (AI and predictive features).</p>`},
{q:"In SAP Business Data Cloud, which part mainly collects and models data from many source systems?",o:["SAP Analytics Cloud","SAP Datasphere","Content Network","The Catalog"],r:1,a:`<p><b>SAP Datasphere</b> is the data layer. SAC sits on top for stories, planning and AI-assisted analysis.</p>`},
{q:"A manager wants a place where only trusted, approved stories are shown to business users. Which area fits best?",o:["My Files","The Catalog","Connections","Security"],r:1,a:`<p>The <b>Catalog</b> is a curated list of trusted content that has been published for users.</p>`},
{q:"You share a story with a colleague as View. Will they see all the data in the model?",o:["Yes, sharing gives full data access","No, they see only the data their roles and model security allow","Only if they are in the same country","Only on Mondays"],r:1,a:`<p>Sharing gives access to the <b>file</b>. What data they see is controlled by <b>roles and data access security</b> on the model.</p>`},
{q:"Where do you go to import a ready-made business content package from SAP?",o:["Content Network","Calendar","Data Analyzer","My Files"],r:0,a:`<p>The <b>Content Network</b> holds business content packages from SAP and partners. You can also use it to move content between tenants.</p>`},
{q:"What is seamless planning, in one sentence?",a:`<p>Planning in SAC where the <b>plan data is stored in SAP Datasphere</b> instead of inside SAC, so it can be used straight away with other data.</p>`}
]},
{m:1,d:1,t:"Data sources, connections and modeling",s:"Get data in and build a model people can trust",
goal:"By the end, you can choose live or import, pick the right object (dataset or model), build a basic model with the right dimensions, and explore data in the Data Analyzer.",
body:`<h3>Step 1: live connection or import?</h3>
<div class="cmp"><div class="card"><h3>Live connection</h3><ul><li>Data <b>stays in the source</b> (for example SAP S/4HANA, SAP BW/4HANA, SAP HANA, SAP Datasphere, BusinessObjects universes).</li><li>Always up to date. No copy is stored in SAC.</li><li>Good when data must not leave the company system or changes all the time.</li><li>Security and calculations mostly come from the source.</li><li>Some SAC features are limited (for example, SAC planning needs a planning model).</li></ul></div>
<div class="card"><h3>Import (acquired) data</h3><ul><li>A <b>copy</b> of the data is loaded into SAC (or into Datasphere for seamless planning).</li><li>Sources: files (Excel, CSV), SQL databases, OData, SAP systems, cloud apps such as SuccessFactors, Google sources and more.</li><li>You can clean ("wrangle") the data while importing.</li><li>Needed for <b>planning models</b> and gives the most SAC features.</li><li>Refresh by <b>scheduling import jobs</b>. Data is only as fresh as the last import.</li></ul></div></div>
<p style="color:var(--soft)">Live connections usually go straight from the user's browser to the source system (so data does not pass through SAC's storage). Some on-premise imports need the <b>SAP Cloud Connector</b> or a data gateway set up by IT.</p>
<h3>Step 2: dataset or model?</h3>
<div class="scroll"><table class="stack"><thead><tr><th>Object</th><th>Best for</th><th>Limits</th></tr></thead><tbody>
<tr><td>Dataset</td><td>Quick, light analysis of one table of data; Smart Predict training data; fast prototyping</td><td>No planning, fewer modeling features, not as reusable</td></tr>
<tr><td>Analytic model</td><td>Reusable reporting with proper dimensions, hierarchies, formulas and security</td><td>No data entry</td></tr>
<tr><td>Planning model</td><td>Budgets and forecasts; data entry, versions, data actions</td><td>Needs a <b>Version</b> and a <b>Date</b> dimension</td></tr></tbody></table></div>
<h3>Step 3: understand the building blocks</h3>
<div class="grid2"><div class="card"><h3>Measures</h3><p>Numbers you add up: Revenue, Quantity, Cost. Each has an <b>aggregation</b> (Sum, Average, Min, Max, Count...). In the <b>new model type</b>, measures are the main building block.</p></div>
<div class="card"><h3>Dimensions</h3><p>The "by" words: by Product, by Region, by Month. Each dimension has <b>members</b> (for example Product: Bikes, Helmets) and <b>attributes</b> (Colour, Size).</p></div>
<div class="card"><h3>Dimension types</h3><ul><li><b>Account</b>: list of financial lines (Revenue, COGS, Margin), with formulas between them</li><li><b>Version</b>: Actual, Budget, Forecast (needed for planning)</li><li><b>Date</b>: year, quarter, month, day</li><li><b>Organization</b>: company, cost centre, with currency</li><li><b>Generic</b>: anything else (Product, Customer)</li></ul></div>
<div class="card"><h3>Hierarchies</h3><ul><li><b>Level-based</b>: built from columns, for example Country → Region → City, or Year → Quarter → Month.</li><li><b>Parent-child</b>: each member points to its parent, good for uneven trees like an org chart or chart of accounts.</li><li>A dimension can have <b>more than one hierarchy</b>.</li></ul></div></div>
<h3>New model type vs classic account model</h3>
<div class="scroll"><table class="stack"><thead><tr><th>Point</th><th>New model (measure-based)</th><th>Classic account model</th></tr></thead><tbody>
<tr><td>Main idea</td><td>Several measures, account dimension optional</td><td>One value per cell; everything is an account member</td></tr>
<tr><td>Calculations</td><td>Calculated measures in the model</td><td>Account formulas</td></tr>
<tr><td>Currency</td><td>Conversion measures that show local and converted values side by side</td><td>Currency dimension added to the model</td></tr>
<tr><td>Good for</td><td>Most new models, mixed data types, flexible reporting</td><td>Existing finance models built the classic way</td></tr></tbody></table></div>
<h3>Step 4: build a basic model (import from a file)</h3>
<ol><li>Modeler → <b>New Model</b> → start from a data file or data source.</li><li>Upload the file. SAC guesses which columns are <b>measures</b> and which are <b>dimensions</b>.</li><li><b>Wrangle</b> the data: fix types, split or join columns, change dates, remove bad rows, set IDs and descriptions.</li><li>Set dimension types (Date, Organization...) and build hierarchies.</li><li>Fix any <b>data quality warnings</b> (missing IDs, mismatched dates).</li><li>Save the model, then <b>schedule</b> the import job if the data must refresh.</li></ol>
<div class="grid2"><div class="card"><h3>Data Analyzer</h3><p>A fast, spreadsheet-like screen for <b>ad-hoc analysis</b> on SAC models, SAP BW queries and SAP Datasphere models. Drag dimensions to rows and columns, filter, drill and add simple calculations. No story needed. You can save the result as an <b>insight</b> or open it in a story.</p></div>
<div class="card"><h3>Model good habits</h3><ul><li>Use clear IDs and descriptions for members.</li><li>Keep only the columns people need.</li><li>Add <b>data access control</b> when not everyone may see all members (for example each region sees only its data).</li><li>Turn on <b>audit</b> (data changes log) for planning models if needed.</li></ul></div></div>`,
say:"Live keeps data at home and fresh. Import gives you a copy and all features, including planning.",
act:"Download any small sales CSV (or make one with Date, Region, Product, Revenue, Quantity). Create a new model from it, set Date as a date dimension, build a Region hierarchy, and save it.",
qs:[
{q:"Your security team says HR data must never be copied out of SAP SuccessFactors' source database, and dashboards must show real-time values. Live or import?",o:["Import","Live connection, if the source supports it","Upload an Excel file every day","Email the data"],r:1,a:`<p>A <b>live connection</b> keeps the data in the source and shows it in real time. (Always confirm the source type supports live access.)</p>`},
{q:"A finance team wants to enter next year's budget directly in SAC. What do they need?",o:["A dataset","A live connection only","A planning model with Version and Date dimensions","A Data Analyzer insight"],r:2,a:`<p>Data entry needs a <b>planning model</b>. Planning models must have a <b>Version</b> dimension and a <b>Date</b> dimension.</p>`},
{q:"Which dimension type holds members like Actual, Budget and Forecast?",o:["Account","Version","Generic","Organization"],r:1,a:`<p>The <b>Version</b> dimension holds data categories such as Actual, Budget, Plan and Forecast.</p>`},
{q:"Your org chart is uneven: some managers have 2 levels below them, others have 6. Which hierarchy type fits?",o:["Level-based","Parent-child","No hierarchy","Date hierarchy"],r:1,a:`<p><b>Parent-child</b> hierarchies handle uneven ("ragged") trees, because each member just points to its parent.</p>`},
{q:"You need a quick look at one CSV file to test an idea, with no planning and no reuse. Simplest object?",o:["Dataset","Planning model","Currency table","Value driver tree"],r:0,a:`<p>A <b>dataset</b> is the light, quick option for one-off analysis or Smart Predict training.</p>`},
{q:"A BW query exists already. A user wants to slice it quickly without building a story. Which tool?",o:["Modeler","Data Analyzer","Calendar","Content Network"],r:1,a:`<p>The <b>Data Analyzer</b> is made for fast ad-hoc analysis on SAC models, BW queries and Datasphere models.</p>`},
{q:"What does 'wrangling' mean in SAC?",a:`<p>Cleaning and shaping data while you import it: fixing data types, splitting or joining columns, changing date formats, replacing values and removing bad rows.</p>`}
]},
{m:2,d:2,t:"Story design and data visualization",s:"Build stories that answer a real business question",
goal:"By the end, you can build a story from scratch or a template, pick the right chart, set up tables, geo maps and input controls, use conditional formatting, and know what scripting adds.",
body:`<p>A <b>story</b> is SAC's dashboard or report. Today SAC uses the <b>optimized story experience</b>: faster, and it combines normal story building with <b>scripting</b> (what used to be "analytic applications").</p>
<h3>Start: what kind of page?</h3>
<div class="grid2"><div class="card"><h3>Responsive page</h3><p>Widgets sit in lanes and <b>re-arrange for phone, tablet and desktop</b>. Best for dashboards people open on many devices.</p></div>
<div class="card"><h3>Canvas page</h3><p>Free placement. You put each widget exactly where you want. Best for fixed layouts, printed reports and pixel-perfect designs.</p></div></div>
<p>You can start a story <b>from scratch</b>, from a <b>template</b> (ready layouts with placeholders), or from data (SAC suggests charts). Templates help a whole team keep the same look.</p>
<h3>Pick the right chart</h3>
<div class="scroll"><table class="stack"><thead><tr><th>Question</th><th>Chart</th></tr></thead><tbody>
<tr><td>How does it compare?</td><td>Bar or column chart</td></tr>
<tr><td>How does it change over time?</td><td>Line chart, or column chart for few periods; time-series chart for long history and forecast</td></tr>
<tr><td>What is it made of?</td><td>Stacked bar, or pie/donut for 2 to 5 parts only</td></tr>
<tr><td>How did we get from A to B?</td><td>Waterfall chart (for example from last year's profit to this year's)</td></tr>
<tr><td>Are two numbers related?</td><td>Scatter or bubble chart</td></tr>
<tr><td>Actual vs target?</td><td>Bullet chart, or bar chart with variance</td></tr>
<tr><td>One headline number?</td><td>Numeric point (KPI tile), with threshold colours</td></tr>
<tr><td>Where is it happening?</td><td>Geo map (bubble, choropleth, heat map layers)</td></tr>
<tr><td>Exact numbers to read or plan?</td><td>Table</td></tr></tbody></table></div>
<div class="grid2"><div class="card"><h3>Widgets you must know</h3><ul><li><b>Chart</b>, <b>table</b>, <b>numeric point</b></li><li><b>Geo map</b>: needs location data (a location dimension built from latitude/longitude or area names)</li><li><b>Input control</b>: a filter box users click to pick members or ranges</li><li><b>Text</b>, <b>image</b>, <b>shape</b>, <b>web page</b>, <b>R visualization</b></li><li><b>Value driver tree</b> (for planning, see the Advanced planning week)</li><li>Script widgets: buttons, dropdowns, radio buttons, popups (with scripting)</li></ul></div>
<div class="card"><h3>Tables</h3><ul><li>Add dimensions to <b>rows</b> and <b>columns</b>, measures or accounts to the data area.</li><li>Expand and collapse hierarchies, show totals.</li><li>Freeze headers, change number format, scale (thousands, millions) and decimals.</li><li>New table builder: add rows and columns from the <b>Builder panel</b>.</li><li>Tables are also where <b>planning data entry</b> happens.</li></ul></div>
<div class="card"><h3>Conditional formatting (thresholds)</h3><ul><li>A <b>threshold</b> colours values by ranges, for example below 90% of target = red, 90–100% = amber, above 100% = green.</li><li><b>Model thresholds</b> are defined once in the model and reused everywhere.</li><li><b>Story thresholds</b> are set in one story only.</li><li>Use colours carefully, and add symbols or labels so colour-blind users also understand.</li></ul></div>
<div class="card"><h3>Preferences, themes and styling</h3><ul><li><b>Story preferences</b>: page size, default fonts, colours, number formats.</li><li><b>Themes</b>: save a company style and reuse it in every story.</li><li><b>Colour palettes</b> and colour sync: the same member has the same colour in every chart.</li><li>Keep it simple: one message per page, clear titles, short labels.</li></ul></div></div>
<h3>Scripting advanced stories</h3>
<p>Scripting lets you add <b>custom behaviour</b>: buttons that switch charts, dropdowns that change measures, popups, and custom filter logic. SAC uses a JavaScript-like script language. Scripts run on <b>events</b>.</p>
<div class="scroll"><table class="stack"><thead><tr><th>Event</th><th>When it runs</th><th>Example use</th></tr></thead><tbody>
<tr><td>onInitialization</td><td>When the story opens</td><td>Set default filters</td></tr>
<tr><td>onSelect</td><td>When a user clicks a data point or item</td><td>Filter another chart</td></tr>
<tr><td>onClick</td><td>When a button is pressed</td><td>Show or hide a chart, open a popup</td></tr>
<tr><td>onResultChanged</td><td>When a widget's data changes</td><td>Update a text widget</td></tr></tbody></table></div>
<p>Example: a button that shows a table and hides a chart: <code>Chart_1.setVisible(false); Table_1.setVisible(true);</code>. Example filter: <code>Chart_1.getDataSource().setDimensionFilter("Region", "EMEA");</code>. Newer releases can even <b>write or explain script from plain-language requests</b> using AI.</p>
<div class="cmp"><div class="card bad"><h3>Weak story</h3><ul><li>15 charts on one page</li><li>3D pies, rainbow colours</li><li>Titles like "Chart 1"</li><li>No filters, no context</li></ul></div><div class="card good"><h3>Strong story</h3><ul><li>One question per page</li><li>KPI tiles on top, detail below</li><li>Titles that say the finding</li><li>Input controls and thresholds that guide the eye</li></ul></div></div>`,
say:"Start with the business question, then choose the page, the chart and the colours. Scripting is for extra interaction.",
act:"Build a story on your model: a responsive page with 3 KPI tiles (with thresholds), a bar chart by region, a line chart by month and an input control for Product.",
qs:[
{q:"Your dashboard must look good on phones and laptops. Which page type?",o:["Canvas page","Responsive page","A PDF","An image"],r:1,a:`<p><b>Responsive pages</b> re-arrange widgets for different screen sizes.</p>`},
{q:"You want to show how last year's profit became this year's profit, step by step (price effect, volume effect, cost effect). Best chart?",o:["Pie chart","Waterfall chart","Scatter chart","Geo map"],r:1,a:`<p>A <b>waterfall chart</b> shows how a starting value moves to an end value through positive and negative steps.</p>`},
{q:"The same 'Margin below 20% is red' rule must apply in every story that uses this model. Where should you set it?",o:["As a story threshold in each story","As a model threshold","In a text box","In the calendar"],r:1,a:`<p>A <b>model threshold</b> is defined once and reused by every story on that model.</p>`},
{q:"Which script event runs when the story first opens?",o:["onSelect","onClick","onInitialization","onResultChanged"],r:2,a:`<p><b>onInitialization</b> runs when the story loads. It is often used to set default filters or visibility.</p>`},
{q:"What does a geo map need in the model?",a:`<p>A <b>location dimension</b>, built from latitude and longitude values or from recognised area names (country, region, city, postcode).</p>`},
{q:"Why use a story template or a theme?",a:`<p>To keep the <b>same layout and style</b> across all stories, save time, and follow company design rules.</p>`},
{q:"A user wants to pick a product and have all charts on the page update. Which widget is the simplest answer?",o:["A text box","An input control (page filter)","A new model","An R visualization"],r:1,a:`<p>An <b>input control</b> filters the page (or the story) by the members the user picks. No script is needed.</p>`}
]},
{m:2,d:3,t:"Analysing and manipulating data in stories",s:"Filter, calculate, blend, comment and keep it fast",
goal:"By the end, you can sort, rank and filter on every level, create the right calculation, blend two models, add data point comments and follow performance best practices.",
body:`<h3>Sorting, ranking and filtering</h3>
<div class="grid2"><div class="card"><h3>Sort and rank</h3><ul><li>Sort by a measure (highest first) or by member name.</li><li><b>Top N / Bottom N</b>: show only the best or worst 5 or 10.</li><li>Ranking keeps attention on what matters.</li></ul></div>
<div class="card"><h3>Filter levels (wide to narrow)</h3><ul><li><b>Story filter</b>: every page and widget in the story</li><li><b>Page filter / input control</b>: all widgets on one page</li><li><b>Widget filter</b>: one chart or table only</li><li><b>Linked analysis</b>: clicking a data point filters other widgets</li></ul></div></div>
<p><b>Linked analysis</b> settings: only this widget, all widgets in the story, or only selected widgets. It works across widgets that use the same model, or models that are linked.</p>
<h3>Calculations in a story</h3>
<div class="scroll"><table class="stack"><thead><tr><th>Type</th><th>What it does</th><th>Example</th></tr></thead><tbody>
<tr><td>Calculated measure</td><td>A new number from a formula</td><td>Margin % = (Revenue − Cost) / Revenue</td></tr>
<tr><td>Restricted measure</td><td>A measure limited to certain members</td><td>Revenue for Bikes only; Revenue for 2025 only</td></tr>
<tr><td>Difference from</td><td>Compares to another member, often time</td><td>Revenue vs previous year, in value or %</td></tr>
<tr><td>Aggregation</td><td>A new aggregation over a dimension</td><td>Count of customers with sales</td></tr>
<tr><td>Dimension to measure</td><td>Turns a numeric attribute into a measure</td><td>List price attribute → a price measure</td></tr>
<tr><td>Calculated dimension</td><td>Groups members into new buckets</td><td>Customers grouped as Small / Medium / Large by revenue</td></tr></tbody></table></div>
<p>Formulas can use functions such as <code>IF</code>, <code>ABS</code>, <code>ROUND</code>, <code>ResultLookup</code> and date functions. <b>Calculations in the story</b> belong to that story only. If many stories need it, put it <b>in the model</b> instead.</p>
<h3>Blending: data from two models in one chart</h3>
<ol><li>Add a chart or table on the <b>primary model</b>.</li><li>Add a second model and choose <b>Link dimensions</b>.</li><li>Map the common dimension (for example Product in both models).</li><li>Now you can show measures from both models side by side, for example Sales (model A) and Marketing spend (model B) by Product.</li></ol>
<p style="color:var(--soft)">Blending works best on matching members and IDs. Not every live-source combination can be blended, so check the help for your source types. Linked models also help linked analysis work across models.</p>
<div class="grid2"><div class="card"><h3>Data point comments</h3><p>Add a comment to <b>one cell or data point</b>: "Revenue dropped because of the March strike." Comments stay with that data, so everyone sees the reason. Must be switched on for the model or story. Great for monthly reviews and planning.</p></div>
<div class="card"><h3>Explorer and drill</h3><p>Drill down a hierarchy (Year → Quarter → Month), drill up again, or open the <b>Explorer</b> to rearrange measures and dimensions freely and create a new chart from it.</p></div></div>
<h3>Performance best practices</h3>
<div class="grid2"><div class="card"><h3>Story design</h3><ul><li>Fewer widgets per page. Split big dashboards into pages.</li><li>Filter early: story or page filters reduce data loaded.</li><li>Use Top N instead of showing thousands of members.</li><li>Avoid many heavy story calculations; move common ones to the model.</li><li>Avoid showing <b>unbooked data</b> unless needed.</li><li>Prefer the optimized story experience.</li></ul></div>
<div class="card"><h3>Tools and settings</h3><ul><li><b>Performance Analysis Tool</b>: shows which widgets and queries are slow.</li><li>Load invisible widgets in the background (in scripted stories).</li><li>Use <b>pause refresh</b> while building tables on big data.</li><li>On live connections, much of the work happens in the source, so tune the source model too.</li></ul></div></div>`,
say:"Filter wide or narrow, calculate in the right place, blend with linked dimensions, and keep every page light.",
act:"In your story, add Top 5 products, a calculated measure for Margin %, a 'Revenue vs previous year' column, and one data point comment on the worst month.",
qs:[
{q:"You need 'Revenue for 2025 only' as its own column next to total Revenue. Which calculation?",o:["Calculated dimension","Restricted measure","Aggregation","Blending"],r:1,a:`<p>A <b>restricted measure</b> limits a measure to chosen members, like Year = 2025.</p>`},
{q:"Clicking on 'Germany' in a bar chart should filter the other charts on the page. What is this called?",o:["Blending","Linked analysis","Scripting only","Data locking"],r:1,a:`<p><b>Linked analysis</b> uses a click on one widget to filter other widgets.</p>`},
{q:"Sales data is in one model and marketing spend in another. You want both by Product in one chart. What do you do?",o:["Copy the data by hand","Blend the models by linking the Product dimension","Make two separate stories","Use a calculated dimension"],r:1,a:`<p><b>Blending</b>: add the second model and link the common dimension (Product).</p>`},
{q:"A story page with 25 charts is very slow. Name 3 fixes.",a:`<p>Any three: split it into several pages; add story or page filters; use Top N; move heavy calculations to the model; hide unbooked data; use the Performance Analysis Tool to find the slowest widgets; tune the live source model.</p>`},
{q:"Where should you create a calculation that 10 different stories need?",o:["In each story","In the model","In a text box","In Excel"],r:1,a:`<p>In the <b>model</b>, so it is defined once and every story uses the same logic.</p>`},
{q:"You want to group customers into Small, Medium and Large by their revenue. Which feature?",o:["Restricted measure","Calculated dimension","Difference from","Data point comment"],r:1,a:`<p>A <b>calculated dimension</b> creates new member groups (buckets) based on a rule.</p>`},
{q:"What is a data point comment good for?",a:`<p>Explaining <b>one specific value</b> (a cell or data point), so everyone who sees that number also sees the reason behind it.</p>`}
]},
{m:3,d:4,t:"Manual planning",s:"Versions, data entry, hierarchies, validation and locking",
goal:"By the end, you can work with public and private versions, enter plan data in many ways, use inverse formulas and alternate hierarchies, and protect data with validation rules and data locking.",
body:`<p><b>Manual planning</b> means people type plan values into tables: budgets, forecasts, headcount, targets. SAC then spreads, checks and saves them.</p>
<h3>Versions: the heart of planning</h3>
<div class="grid2"><div class="card"><h3>Public versions</h3><p>Shared by everyone, for example <b>Actual</b>, <b>Budget 2027</b>, <b>Forecast Q2</b>. Each version has a <b>category</b>: Actual, Budget, Planning, Forecast, Rolling Forecast.</p></div>
<div class="card"><h3>Private versions</h3><p>Your own sandbox copy. Try ideas ("what if sales drop 10%?") without changing the shared plan. You can share a private version or publish it as a new public version.</p></div></div>
<h3>The edit and publish cycle</h3>
<ol><li>You start typing in a public version. SAC puts it in <b>edit mode</b>: a temporary private copy just for you.</li><li>Others don't see your changes yet.</li><li><b>Publish</b> to save changes into the public version. <b>Revert</b> to throw them away.</li><li><b>Publish As</b> saves your changes as a <b>new</b> public version (the original stays untouched).</li></ol>
<p>Use the <b>Version Management</b> panel to copy versions, create new ones, publish, revert and delete.</p>
<h3>Ways to enter data</h3>
<div class="scroll"><table class="stack"><thead><tr><th>Method</th><th>What happens</th></tr></thead><tbody>
<tr><td>Type in a leaf cell</td><td>The value is saved for that exact member combination, and totals update.</td></tr>
<tr><td>Type in a total (parent) cell</td><td>SAC <b>spreads</b> (disaggregates) the value down to the children. If the children have data, it spreads by their current weights. If they are empty, it spreads evenly.</td></tr>
<tr><td>Unbooked cells</td><td>Empty member combinations. Show them in the table to plan for new products or regions.</td></tr>
<tr><td>Value lock</td><td>Temporarily lock a cell so its value stays fixed while you change totals around it.</td></tr>
<tr><td>Spreading / distribution panel</td><td>Control exactly how to spread or move values between members.</td></tr>
<tr><td>Copy and paste</td><td>Paste ranges from Excel or within the table.</td></tr>
<tr><td>Mass data entry</td><td>Type many values first, then SAC processes them all in one go. Good for big inputs.</td></tr>
<tr><td>Fluid data entry</td><td>Keep typing while SAC is still processing earlier entries, so you don't wait after each cell.</td></tr>
<tr><td>Plan from Excel</td><td>The SAP Analytics Cloud add-in for Microsoft Office lets you plan in Excel.</td></tr></tbody></table></div>
<div class="grid2"><div class="card"><h3>Inverse formulas</h3><p>Normally you can't type into a calculated value. An <b>inverse formula</b> tells SAC how to work backwards. Example: Revenue = Price × Quantity. You type a new Revenue, and the inverse formula changes Quantity so the maths still works.</p></div>
<div class="card"><h3>Multiple hierarchies</h3><p>A dimension can have several hierarchies, for example Products by <b>Category</b> and by <b>Brand</b>. You can view and plan on an alternate hierarchy; data is still saved on the leaf members, so both views stay in sync.</p></div>
<div class="card"><h3>Data validation rules</h3><p>Rules in the model that allow only <b>valid member combinations</b>. Example: product "Snow Boots" may only be planned for the regions "North" and "Alps". Invalid cells are blocked, so nobody plans nonsense.</p></div>
<div class="card"><h3>Data locking</h3><p>Protects data from changes. Set on <b>driving dimensions</b> (for example Version and Cost Centre). Each slice has a state:<ul><li><b>Open</b>: anyone with rights can edit</li><li><b>Restricted</b>: only the owner can edit</li><li><b>Locked</b>: nobody can edit</li><li><b>Mixed</b>: parts are in different states</li></ul>Owners can be set per slice. Locks are often switched by calendar tasks at deadlines.</p></div></div>
<div class="grid2"><div class="card"><h3>Data access control vs data locking</h3><p><b>Data access control</b> = who may <b>see or write</b> which members (security). <b>Data locking</b> = whether a slice of data is <b>open for change right now</b> (process control). Exam scenarios often test this difference.</p></div>
<div class="card"><h3>SAP Datasphere and planning</h3><p>With <b>seamless planning</b>, the planning model's data is stored in SAP Datasphere. Actuals in Datasphere can also be shown in a live version without copying them. Plans are immediately available for other Datasphere models.</p></div></div>`,
say:"Plan in your own edit copy, publish when ready, and protect the plan with validation rules and data locks.",
act:"Make a planning model (add a Version dimension). In a table, type a yearly total and watch it spread to months. Lock one month with value lock and type the total again. Then Publish.",
qs:[
{q:"You type numbers into the public Budget version. Who sees your changes before you publish?",o:["Everyone","Only you, because you are in edit mode (a private copy)","Only admins","Nobody, not even you"],r:1,a:`<p>Editing a public version creates a temporary <b>edit mode</b> copy for you only. Others see the changes after you <b>Publish</b>.</p>`},
{q:"You want to keep the original Budget and save your changes as a separate new plan. Which option?",o:["Publish","Revert","Publish As","Delete"],r:2,a:`<p><b>Publish As</b> saves your changes as a new public version and leaves the original untouched.</p>`},
{q:"You type 1,200 into a yearly total for a product that has no data yet. How does SAC spread it to 12 months?",o:["All into January","Evenly: 100 per month","It refuses","Randomly"],r:1,a:`<p>With no existing data (unbooked), SAC spreads <b>evenly</b>. If the months already have data, it spreads by their current weights.</p>`},
{q:"Revenue = Price × Quantity. Users want to type Revenue and have Quantity change. What do you need?",o:["A data lock","An inverse formula","A new version","A geo map"],r:1,a:`<p>An <b>inverse formula</b> lets users type into the calculated value and works backwards to the inputs.</p>`},
{q:"After the budget deadline, nobody should change Budget data for Cost Centre 100, but the owner may still fix it. Which lock state?",o:["Open","Restricted","Locked","Mixed"],r:1,a:`<p><b>Restricted</b>: only the owner can still change the data. <b>Locked</b> would block everyone.</p>`},
{q:"Planners keep entering sales for products in regions where they are not sold. What prevents this?",o:["Data validation rules","A theme","Linked analysis","A dataset"],r:0,a:`<p><b>Data validation rules</b> allow only valid member combinations, so invalid cells cannot be planned.</p>`},
{q:"What is the difference between data access control and data locking?",a:`<p><b>Data access control</b> is security: who can see or write which members. <b>Data locking</b> is process control: whether a data slice is open, restricted or locked for changes at this moment.</p>`},
{q:"What is the difference between mass data entry and fluid data entry?",a:`<p><b>Mass data entry</b>: type many values, then process them all together. <b>Fluid data entry</b>: keep typing while SAC processes earlier entries in the background.</p>`}
]},
{m:3,d:5,t:"Advanced planning features",s:"Data actions, multi actions, allocations, forecasts and simulation",
goal:"By the end, you can choose the right data action step, write simple advanced formulas, chain steps in a multi action, set up allocations and currency conversion, build rolling and predictive forecasts, and simulate with value driver trees and Compass.",
body:`<h3>Data actions: automatic changes to plan data</h3>
<p>A <b>data action</b> is a saved set of steps that changes data in a planning model. Users run it with a button in a story, from a calendar task, or on a schedule.</p>
<div class="scroll"><table class="stack"><thead><tr><th>Step type</th><th>What it does</th><th>Example</th></tr></thead><tbody>
<tr><td>Copy</td><td>Copies data inside one model, with rules and filters</td><td>Copy Actual 2026 to Budget 2027 as a starting point</td></tr>
<tr><td>Cross-model copy</td><td>Copies data from one planning model to another, mapping dimensions</td><td>Copy headcount cost from HR model into the finance P&amp;L model</td></tr>
<tr><td>Advanced formulas</td><td>Script-like calculations, conditions and loops</td><td>Revenue = Quantity × Price for every product</td></tr>
<tr><td>Allocation</td><td>Spreads a value from a source to targets using a driver</td><td>Spread IT cost to departments by headcount</td></tr>
<tr><td>Currency conversion</td><td>Converts values using the currency rate table</td><td>Convert EUR plans to USD</td></tr>
<tr><td>Embedded data action</td><td>Runs another data action inside this one</td><td>Reuse a standard "copy actuals" action</td></tr></tbody></table></div>
<p><b>Parameters</b> make data actions flexible: the user picks the version or year when running it.</p>
<h3>Advanced formulas: the basics</h3>
<pre style="min-height:0">MEMBERSET [d/Date] = "202701" TO "202712"
MEMBERSET [d/Version] = "public.Budget"

DATA([d/Account] = "Revenue") =
  RESULTLOOKUP([d/Account] = "Quantity") * RESULTLOOKUP([d/Account] = "Price")</pre>
<div class="grid2"><div class="card"><h3>Key words</h3><ul><li><b>MEMBERSET</b>: limits which data the script works on (scope)</li><li><b>DATA()</b>: the target cells you write to</li><li><b>RESULTLOOKUP()</b>: reads values (source)</li><li><b>IF ... ENDIF</b>: conditions</li><li><b>FOREACH ... ENDFOR</b>: loops, for example month by month</li><li><b>DELETE()</b>: removes data in a scope</li><li><b>CONFIG</b> lines: settings such as how to treat unbooked data</li></ul></div>
<div class="card"><h3>Good habits</h3><ul><li>Always set a tight <b>MEMBERSET</b> scope: faster and safer.</li><li>Test on a <b>private version</b> first.</li><li>Comment your script (<code>//</code>).</li><li>Use parameters instead of hard-coded years.</li><li>Check results with a table before and after.</li></ul></div></div>
<h3>Multi actions: chain everything</h3>
<p>A <b>multi action</b> runs several steps in order, across one or more models. Steps can be: <b>data actions</b>, <b>version management</b> (for example publish a version), <b>predictive</b> steps (run a time-series forecast), <b>data import</b> steps, <b>API</b> steps (call another system) and <b>data locking</b> steps. One click runs the whole process, for example: import actuals → copy to forecast → run predictive forecast → convert currency → publish.</p>
<div class="grid2"><div class="card"><h3>Allocations</h3><p>Move cost or revenue from a <b>source</b> (shared IT cost) to <b>targets</b> (departments) using a <b>driver</b> (headcount, square metres, hours). Set up as an allocation step in a data action. You can allocate in several stages.</p></div>
<div class="card"><h3>Currency conversion</h3><p>Needs a <b>currency rate table</b> with rates by date, rate version and rate type (for example Average or Closing). The model has a currency setting (default or by organisation). In new models, <b>conversion measures</b> show local and converted values side by side; in planning, a conversion step can write converted values.</p></div>
<div class="card"><h3>Rolling forecast</h3><p>A forecast that always looks a fixed number of months ahead (for example the next 12). Use the table's <b>forecast layout</b>: past periods show <b>Actual</b>, future periods show the forecast version, split at a <b>cut-over date</b> that moves forward each month.</p></div>
<div class="card"><h3>Predictive forecast</h3><p>Let SAC suggest future values from history. Run <b>predictive forecasting</b> on table cells, or a <b>time-series</b> predictive scenario in Smart Predict, and write results into a planning version (also possible as a multi action step). Always review the numbers before publishing.</p></div>
<div class="card"><h3>Value driver tree (VDT)</h3><p>A tree that shows how <b>drivers</b> (price, volume, headcount) roll up to a <b>result</b> (profit). Change a driver node and see the effect flow up the tree. Great for "what if" simulation and for explaining the plan to management.</p></div>
<div class="card"><h3>SAP Analytics Cloud Compass</h3><p>A simulation tool using <b>Monte Carlo</b> methods. Instead of one number, you give <b>ranges</b> for uncertain drivers, and Compass runs many simulations to show the <b>likely range of outcomes</b> and their probability, for example "70% chance profit is above 2 million".</p></div></div>
<h3>Calendar-driven planning processes</h3>
<p>The <b>calendar</b> organises the planning process: <b>processes</b> group tasks; <b>general tasks</b> ask people to do work; <b>review</b> and <b>approval</b> tasks let managers check; <b>data action</b>, <b>multi action</b> and <b>data locking</b> tasks run automatically on a date. Tasks have owners, assignees, due dates, dependencies and can repeat.</p>`,
say:"Data actions change data, multi actions chain steps, and VDTs and Compass let you test the future before it happens.",
act:"Create a data action with a Copy step (Actual to Budget) and an advanced formula that increases Revenue by 5%. Add a button in your story to run it. Then put it into a multi action followed by a Publish version step.",
qs:[
{q:"Shared office rent must be spread to departments by their square metres. Which data action step?",o:["Copy","Allocation","Currency conversion","Embedded data action"],r:1,a:`<p>An <b>allocation</b> step spreads a source value to targets using a driver (square metres).</p>`},
{q:"Headcount costs are planned in the HR model but must appear in the Finance model. Which step?",o:["Copy","Cross-model copy","Delete","Value lock"],r:1,a:`<p><b>Cross-model copy</b> moves data from one planning model to another, mapping the dimensions.</p>`},
{q:"In an advanced formula, which keyword limits the data the script works on?",o:["DATA","RESULTLOOKUP","MEMBERSET","ENDFOR"],r:2,a:`<p><b>MEMBERSET</b> sets the scope. A tight scope makes scripts faster and safer.</p>`},
{q:"Every month you must: import actuals, copy them into the forecast, run a predictive forecast and publish. One click. What do you build?",o:["One story","A multi action","A theme","A dataset"],r:1,a:`<p>A <b>multi action</b> chains data import, data actions, predictive and version management steps into one run.</p>`},
{q:"Management asks: 'What is the chance profit ends above target, given price and volume are uncertain?' Best tool?",o:["SAP Analytics Cloud Compass","A pie chart","Data locking","A calculated dimension"],r:0,a:`<p><b>Compass</b> uses Monte Carlo simulation on driver ranges to show likely outcomes and their probability.</p>`},
{q:"What is a rolling forecast and how does SAC show it?",a:`<p>A forecast that always covers a fixed number of future periods (for example 12 months). In a table's <b>forecast layout</b>, past periods show Actual and future periods show the forecast, split at a <b>cut-over date</b>.</p>`},
{q:"What do you need before you can convert currencies in a model?",a:`<p>A <b>currency rate table</b> (rates by date, rate version and rate type), and currency conversion turned on in the model (a model or organisation currency setting; conversion measures in new models).</p>`},
{q:"Why test a data action on a private version first?",a:`<p>So mistakes don't change the shared public plan. You can check results, then run it on the real version.</p>`}
]},
{m:4,d:6,t:"Augmented analytics and collaboration",s:"Ask in plain words, let AI explain, and work as a team",
goal:"By the end, you can pick the right smart feature for a business question and use discussions, comments, sharing and the calendar to work together.",
body:`<h3>Smart features: which one when?</h3>
<div class="scroll"><table class="stack"><thead><tr><th>Feature</th><th>What it does</th><th>Use it when</th></tr></thead><tbody>
<tr><td>Just Ask</td><td>Type a question in normal words ("revenue by region last year") and get a chart</td><td>Business users need quick answers without building a story</td></tr>
<tr><td>Joule</td><td>SAP's AI copilot. Chat-style help, analytical insights, and help with tasks; also reachable from other SAP apps</td><td>Users want to ask questions and get help in a conversation</td></tr>
<tr><td>Smart Insights</td><td>Explains a number: top contributors and what drives a value or a change</td><td>"Why is March so high?"</td></tr>
<tr><td>Smart Discovery</td><td>Explores a model around one target measure: key influencers, unexpected values, simulation</td><td>"What drives our profit?" on a whole dataset</td></tr>
<tr><td>Time-series forecast in a chart</td><td>Adds an automatic forecast line to a line or time-series chart</td><td>Quick view of where a trend is going</td></tr>
<tr><td>Smart Grouping</td><td>Finds natural groups (clusters) in a scatter or bubble chart</td><td>Customer segmentation</td></tr>
<tr><td>Smart Predict</td><td>Build predictive scenarios: <b>classification</b>, <b>regression</b>, <b>time series</b></td><td>Proper predictions to use in stories or planning</td></tr></tbody></table></div>
<h3>Smart Predict in simple words</h3>
<div class="grid3"><div class="card"><h3>Classification</h3><p>Yes/No answers. "Will this customer leave?" "Will this invoice be paid late?" Gives a probability per row.</p></div>
<div class="card"><h3>Regression</h3><p>A number. "How much will this customer spend?" "What will this house cost?"</p></div>
<div class="card"><h3>Time series</h3><p>Future values over time. "Sales for the next 12 months." Results can be written into a planning version.</p></div></div>
<p>Each predictive model shows quality numbers (for example <b>predictive power</b> and <b>prediction confidence</b>) and the most important <b>influencers</b>. Train on clean history, check quality, then apply to new data.</p>
<div class="grid2"><div class="card"><h3>Good habits with AI features</h3><ul><li>Admins may need to switch features on and index models (for example for Just Ask).</li><li>Good member names and descriptions make natural-language answers better.</li><li>AI suggestions are a starting point. Check them before decisions.</li><li>Data access rules still apply: users only get answers from data they may see.</li></ul></div>
<div class="card"><h3>Prompt insights and story code help</h3><p>Newer releases add AI-assisted <b>prompt insight widgets</b> (a prompt plus chart or table context) and help that <b>writes or explains story scripts</b> from plain language. Features change often, so check the release notes for your tenant.</p></div></div>
<h3>Collaboration</h3>
<div class="grid2"><div class="card"><h3>Discussions</h3><p>Chat with colleagues inside SAC. Start a discussion, invite people, and link it to a story so the conversation stays with the content.</p></div>
<div class="card"><h3>Comments</h3><ul><li><b>Widget comments</b> on a chart or table</li><li><b>Data point comments</b> on one value</li><li>Comments in the <b>calendar</b> on tasks</li><li>Mention people so they get a notification</li></ul></div>
<div class="card"><h3>Sharing and publishing</h3><ul><li>Share files with users or teams (View, Edit, Full Control).</li><li><b>Bookmarks</b>: save a filtered state of a story for yourself or others.</li><li><b>Schedule publications</b>: email a story as PDF or PowerPoint on a schedule.</li><li>Publish to the <b>Catalog</b> for trusted content.</li></ul></div>
<div class="card"><h3>Calendar for teamwork</h3><ul><li>Processes and tasks with owners and due dates</li><li>Review and approval steps, with status (open, in progress, successful, rejected)</li><li>Reminders and notifications</li><li>Automatic tasks (data actions, multi actions, data locking)</li></ul></div></div>`,
say:"Ask with Just Ask or Joule, explain with Smart Insights, predict with Smart Predict, and keep the team in the loop with comments and the calendar.",
act:"Ask 3 questions in Just Ask (or Joule) on your model. Run Smart Insights on your highest month. Then add a widget comment that mentions a colleague, and schedule the story as a PDF.",
qs:[
{q:"A sales manager asks 'Why is revenue in March so much higher?' Which feature explains the top contributors?",o:["Smart Insights","Data locking","Currency conversion","Themes"],r:0,a:`<p><b>Smart Insights</b> explains a data point by showing its top contributors and drivers.</p>`},
{q:"You must predict whether each customer will cancel next month (yes or no). Which Smart Predict type?",o:["Regression","Classification","Time series","Smart Grouping"],r:1,a:`<p><b>Classification</b> predicts a yes/no (or category) outcome, with a probability per row.</p>`},
{q:"You need next year's monthly sales predicted from 5 years of history, and written into a forecast version. Which type?",o:["Classification","Regression","Time series","Smart Discovery"],r:2,a:`<p>A <b>time-series</b> predictive scenario forecasts values over time, and results can be saved into a planning version.</p>`},
{q:"A business user wants to type 'top 5 products by margin in 2026' and get a chart. Which feature?",o:["Just Ask (or Joule)","Advanced formulas","Data validation rules","The Modeler"],r:0,a:`<p><b>Just Ask</b> (and Joule) answer natural-language questions with charts.</p>`},
{q:"The CFO wants the monthly report emailed as a PDF on the first working day of each month. What do you set up?",o:["A schedule publication","A data lock","A cross-model copy","A calculated dimension"],r:0,a:`<p><b>Schedule publication</b> sends a story as PDF or PowerPoint to recipients on a schedule.</p>`},
{q:"Name two ways to collaborate in SAC.",a:`<p>Any two: discussions, widget comments, data point comments, mentions and notifications, sharing, bookmarks, scheduled publications, calendar tasks with reviews and approvals.</p>`},
{q:"Does Just Ask show users data they are not allowed to see?",o:["Yes","No, data access rules still apply"],r:1,a:`<p><b>No.</b> Smart features respect the same roles and data access control as stories.</p>`}
]},
{m:4,d:-1,t:"Exam prep: the scenario-based assessment",s:"How the C_SAC exam works and how to answer like a pro",
goal:"By the end, you know exactly how the C_SAC exam works, you have a simple way to answer any scenario, and you have a study plan.",
body:`<h3>Exam facts (official SAP Learning page)</h3>
<div class="scroll"><table class="stack"><thead><tr><th>Item</th><th>Detail</th></tr></thead><tbody>
<tr><td>Name</td><td>SAP Certified - Data Analyst - SAP Analytics Cloud</td></tr>
<tr><td>Code</td><td>C_SAC (older versions were C_SAC_2402, C_SAC_2421, C_SAC_2501...)</td></tr>
<tr><td>Level</td><td>Associate</td></tr>
<tr><td>Format</td><td><b>Scenario-Based Assessment</b>: 1 activity</td></tr>
<tr><td>Time</td><td>2 hours</td></tr>
<tr><td>Pass score</td><td>60%</td></tr>
<tr><td>How you answer</td><td><b>AI-guided role-play</b> (recommended): a virtual interview with an AI person playing a client or stakeholder. Or record a <b>video</b> for a human reviewer.</td></tr>
<tr><td>Scoring</td><td>Each exam objective is rated 1 (Insufficient) to 5 (Excellent). The AI judges the <b>meaning</b> of your answer, not keywords.</td></tr>
<tr><td>Results</td><td>AI option: see your analysis right after. Video option: up to 20 business days.</td></tr>
<tr><td>Attempts</td><td>Up to 4 attempts in 12 months, at least 24 hours apart. Each attempt uses one attempt from your subscription.</td></tr>
<tr><td>Languages</td><td>AI role-play in many languages (English, Spanish, French, Japanese and more); video in English</td></tr>
<tr><td>You need</td><td>SAP Universal ID, a microphone (camera optional), cookies on. On strict company networks, IT may need to allow *.yoodli.ai and storage.googleapis.com.</td></tr>
<tr><td>Learning journey</td><td>"Becoming a Certified Data Analyst in SAP Analytics Cloud" (about 25 hours): SACE11 Exploring SAC, SACS21 Designing Stories, SACP23 Manual Planning, SACP34 Advanced Planning</td></tr></tbody></table></div>
<div class="say"><b>Important</b>Pausing the role-play does <b>not</b> stop the exam timer. SAP can change the exam at any time, so check the official page on learning.sap.com before you book.</div>
<h3>The 7 topic areas</h3>
<p>SAP does not publish weights for the new format. Expect one connected business scenario that can touch <b>all 7 areas</b>: getting started, data and modeling, story design, analysing data, manual planning, advanced planning, and augmented analytics with collaboration.</p>
<h3>Answer any scenario with C-L-E-A-R</h3>
<div class="scroll"><table class="stack"><thead><tr><th>Step</th><th>What to say</th><th>Example</th></tr></thead><tbody>
<tr><td>C · Clarify</td><td>Repeat the real business need in one sentence; ask a question if something is missing</td><td>"So you need a monthly forecast that finance trusts, by region."</td></tr>
<tr><td>L · Lay out the data</td><td>Source, live or import, model type, key dimensions</td><td>"Actuals come live from Datasphere; plans go into a planning model with Version and Date."</td></tr>
<tr><td>E · Explain the build</td><td>The SAC features, in order</td><td>"A copy data action seeds the forecast, then a time-series step, then publish."</td></tr>
<tr><td>A · Assure quality and control</td><td>Security, validation, locking, performance, review</td><td>"Data locking after the deadline; validation rules for valid products by region."</td></tr>
<tr><td>R · Result for the business</td><td>Why this helps, and one trade-off</td><td>"Planners save days each month; the trade-off is that import data refreshes on a schedule."</td></tr></tbody></table></div>
<div class="grid2"><div class="card"><h3>Study plan (6 weeks)</h3><ul><li>Week 1: Start and connect (3 lessons).</li><li>Week 2: Reporting (4 lessons).</li><li>Week 3: Scripting (3 lessons).</li><li>Week 4: Manual planning (3 lessons).</li><li>Week 5: Advanced planning (2 lessons).</li><li>Week 6: Smart features, the practice exam and role-plays out loud.</li><li>Use a free SAC trial or SAP Learning's practice systems for hands-on work.</li></ul></div>
<div class="card"><h3>Exam-day tips</h3><ul><li>Test your mic, browser and network the day before.</li><li>Speak in short, clear sentences. Name the SAC feature <b>and</b> say why.</li><li>If the AI pushes back, don't panic: explain your reasoning, or adjust if their new fact changes the answer.</li><li>Mention risks and controls (security, locking, review). Stakeholders love that.</li><li>Use the free AI practice tool on SAP Learning before your real attempt.</li></ul></div></div>`,
say:"Clarify, Lay out the data, Explain the build, Assure control, Result. Say the feature and the reason.",
act:"Pick one role-play scenario on this site. Answer every question out loud in under 90 seconds each, using C-L-E-A-R. Record yourself and listen back.",
qs:[
{q:"What is the pass score for C_SAC?",o:["50%","60%","70%","80%"],r:1,a:`<p><b>60%</b>, on one scenario-based activity in 2 hours.</p>`},
{q:"In the AI-guided option, what does the AI score?",o:["Exact keywords only","The meaning (semantic intent) of your answers, per exam objective, 1 to 5","Your accent","How fast you talk"],r:1,a:`<p>It evaluates the <b>meaning</b> of your answers, rating each exam objective from 1 (Insufficient) to 5 (Excellent).</p>`},
{q:"How many attempts can you make in 12 months?",o:["1","2","Up to 4, at least 24 hours apart","Unlimited"],r:2,a:`<p><b>Up to 4 attempts</b> in a 12-month period, with at least 24 hours between them.</p>`},
{q:"You pause the role-play to get water. Does the exam timer stop?",o:["Yes","No, the timer keeps running"],r:1,a:`<p><b>No.</b> Pausing freezes the role-play, but the exam timer keeps going.</p>`},

["Calc","Safe division (no divide-by-zero)","IF([Revenue] = 0, NULL, ([Revenue] - [Cost]) / [Revenue])"],
["Calc","Variance to target","[Actual Revenue] - [Target Revenue]\n\nVariance % : ([Actual Revenue] - [Target Revenue]) / ABS([Target Revenue])"],
["Calc","Price per unit","[Revenue] / [Quantity]"],
["Formula","Revenue from price and quantity","MEMBERSET [d/Version] = \"public.Budget\"\nMEMBERSET [d/Date] = \"202701\" TO \"202712\"\n\nDATA([d/Account] = \"Revenue\") =\n  RESULTLOOKUP([d/Account] = \"Quantity\") * RESULTLOOKUP([d/Account] = \"Price\")"],
